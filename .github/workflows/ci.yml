name: CI

on:
  push:
  pull_request:
  schedule:
    # nightly, 03:17 UTC: the gate-G1 realism panel (lead's ruling, 2026-09-03)
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `dorny/paths-filter` in the g1-changes job below asks the pull-request Files API which
  # files a PR changed. Declaring `permissions:` at all sets every scope not listed to
  # none, so with `contents: read` alone the job died on a pull_request event with
  # "Resource not accessible by integration" while the same job passed on the push event
  # for the same commit — and the g1 panel was silently SKIPPED on the PR, because it is
  # gated on that job's output. Read-only, and the workflow needs nothing else.
  pull-requests: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Allow unprivileged user namespaces (the tool registry's sandbox jail)
        # tools/sandbox.py runs every workflow in a user+mount+pid namespace built with
        # unshare(1). Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1) for unconfined
        # binaries; 22.04 has no such key. The sandbox tests fail closed without this.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --pid --fork true
      - name: Make pivot_root available at /sbin/pivot_root (the sandbox jail calls it there)
        # The jail script in tools/sandbox.py calls /sbin/pivot_root by its absolute path.
        # The ubuntu-latest image changed between the nightlies of 2026-10-31 and
        # 2026-11-01 and the binary was no longer there, so every jailed test failed to
        # build its jail. This step prints what the image has, installs or links the
        # binary to /sbin/pivot_root, and fails loudly if it is still missing
        # (docs/decisions.md, 2026-11-02). tools/sandbox.py is unchanged.
        run: |
          echo "--- diagnostics"
          cat /etc/os-release || true
          ls -ld /sbin || true
          ls -l /sbin/pivot_root /usr/sbin/pivot_root /bin/pivot_root /usr/bin/pivot_root 2>&1 || true
          command -v pivot_root || true
          dpkg -S pivot_root 2>&1 || true
          echo "--- fix"
          if [ ! -x /sbin/pivot_root ]; then
            found="$(command -v pivot_root || true)"
            for p in /usr/sbin/pivot_root /usr/bin/pivot_root /bin/pivot_root; do
              [ -z "$found" ] && [ -x "$p" ] && found="$p"
            done
            if [ -z "$found" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq util-linux-extra || sudo apt-get install -y -qq util-linux
              found="$(command -v pivot_root || true)"
              for p in /usr/sbin/pivot_root /usr/bin/pivot_root /bin/pivot_root; do
                [ -z "$found" ] && [ -x "$p" ] && found="$p"
              done
            fi
            if [ ! -x /sbin/pivot_root ] && [ -n "$found" ]; then
              sudo ln -sf "$found" /sbin/pivot_root
            fi
          fi
          ls -l /sbin/pivot_root
          test -x /sbin/pivot_root
      - name: pytest
        run: pytest -q

  # The gate-G1 anchor comparison is deselected from the run above by the `g1` marker
  # (pyproject.toml): it is twenty-four 180-day Level-0 runs plus a two-year generator
  # draw, ~9 min, and it only tells you something when the simulator has changed. So it
  # runs nightly, and on any pull request that touches sim/ (lead's ruling, 2026-09-03).
  # (The panel was twelve runs and ~3 min when this job was written; the lead's ruling 1
  # of the same day made "zero souring on clean Level-0 seeds" the acceptance condition
  # and the panel was widened to twenty-four. Number corrected 2026-09-04.)
  g1-changes:
    name: does this change touch sim/?
    runs-on: ubuntu-latest
    outputs:
      sim: ${{ steps.filter.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sim:
              - 'sim/**'
              - 'configs/**'
              - 'anchor/compare_generated.py'
              - 'scenarios/**'

  g1:
    name: gate G1 anchor panel
    needs: g1-changes
    if: github.event_name == 'schedule' || needs.g1-changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Allow unprivileged user namespaces (the tool registry's sandbox jail)
        # tools/sandbox.py runs every workflow in a user+mount+pid namespace built with
        # unshare(1). Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1) for unconfined
        # binaries; 22.04 has no such key. The sandbox tests fail closed without this.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --pid --fork true
      - name: pytest -m g1
        run: pytest -q -m g1
