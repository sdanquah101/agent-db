# Plant A -- the TRUTH-SIDE record of its two declared baselines (lead's ruling B5,
# 2026-09-10). Schema: sim/plants/truth/__init__.py. Read by the harness
# (sim.run.harness.apply_adaptation); NOT readable by a workflow (the module and the path
# both spell `truth`, which tests/test_truth_isolation.py flags).
#
# The visible contract, configs/plants/plant_A.yaml, declares that these two baselines
# exist and what KIND of digester each is, qualitatively. Everything numeric about them is
# here, because with the numbers in the visible file the redaction of `baseline` from the
# manifest was defeated: a run's own acetate against a published per-baseline table said
# which state the digester was in (whole-branch review, finding B5).
#
# THE ADAPTED CONSTANT (lead's ruling 2, 2026-09-03). ADM1's default acetoclastic
# free-ammonia inhibition constant (BSM2 K_I_nh3 = 0.0018 kmol N/m3, ~25 mg NH3-N/L) is for
# a mesophilic sewage-sludge community. AFBI Hillsborough has run for years at a digestate
# TAN of 2.3-4.3 kg N/m3 (configs/plant_a_statistics.yaml, Tisocco et al. 2024 §3.2) while
# producing steadily, which a community at the default constant cannot do: at the default
# the acetoclastic methanogens wash out entirely within ~800 d and the whole acetate flux
# goes through syntrophic oxidation, leaving the Level-5/6/7 ammonia scenarios nothing to
# act on. An adapted community is the physical explanation and the one the plant's own
# stable operation evidences.
#
# The lead's ruling sets the adapted range at 0.02-0.05 kmol N/m3. The value is the BOTTOM
# of that range, and the reason is measured rather than aesthetic (gate G1, 2026-09-03):
#
#   * Acetoclasts and SAO compete for one substrate, so they cannot coexist at a steady
#     state. Whichever has the lower break-even acetate concentration excludes the other.
#     Measured: at K_I below ~0.003 SAO wins outright, above it the acetoclasts do, and
#     the stochastic feed does not change this. There is therefore NO adapted K_I in
#     0.02-0.05 at which both are present -- the plant is acetoclastic at all of them.
#   * The Level-5/6/7 rows are therefore staged as *transitions*: the run starts adapted
#     and acetoclastic, and a loss of adaptation at the onset day takes K_I below the
#     exclusion threshold, after which SAO grows in behind the inhibited acetoclasts. It
#     does NOT take over inside the horizon (measured 2026-09-10: 9.0 % of the
#     acetate-consuming biomass in S5-01 and 3.2 % in S7-02 by day 240, 1.2 % / 0.4 % at
#     200 d); the row's signal is the acetate accumulation the inhibition causes.
#   * `ammonia_inhibition_shift` admits multipliers of 0.1 to 10 (sim/faults/schema.py,
#     frozen). 0.02 x 0.1 = 0.002 is below the ~0.003 threshold; 0.035 x 0.1 = 0.0035 is
#     ABOVE it, so from the midpoint the largest admissible loss of adaptation does not
#     reach the shift at all. 0.02 is the only part of the ruled range from which the
#     frozen magnitude range can express a full de-adaptation.
#
# tests/test_run_harness.py pins the exclusion threshold and this consequence.
#
# TWO BASELINES (lead's ruling 1, 2026-09-09). Which community this digester carries
# decides whether a Level-6 structural row means anything, so it is declared (in the
# visible contract, qualitatively) and named by the scenario rather than left implicit in
# a burn-in length.
#
# MEASURED, at the 400-d burn-in and a 180-d horizon at seed 1000, through the full harness.
# RE-MEASURED 2026-09-10 on the current feed, after the calcium ruling (cattle slurry's
# dissolved calcium 0.04 -> 0.00005 kmol/m3, inorganic carbon 0.05 -> 0.1249) and the
# liquid-fraction generator fix changed what this plant is fed. Medians from day 30:
#
#   baseline     X_ac      X_sao     SAO share   acetate      TAN median   pH     CH4
#   adapted      1.065     6.9e-05   0.000       0.037 kg/m3  3.703        7.73   0.629
#   unadapted    0.0019    0.853     0.998       0.240 kg/m3  3.614        7.72   0.628
#
# What moved and by how much (previous 2026-09-09 values: adapted X_ac 1.129, pH 7.80,
# CH4 0.688, TAN 3.695; unadapted X_ac 9.9e-05, X_sao 0.910, pH 7.79, CH4 0.692, TAN
# 3.605): TAN within 0.01 on both (nothing changed the feed nitrogen); pH down 0.07 and CH4
# down 6 points on both, because the slurry's missing inorganic carbon now arrives and
# leaves as CO2; biomass down ~6 %. Both baselines are still the communities they declare --
# the unadapted acetoclasts are 19x the old value but still 0.2 % of the acetate-consuming
# biomass -- so nothing about K_I was touched (the lead's condition).
#
# Both are SOUND digesters; they are two different ones. In the adapted baseline syntrophic
# acetate oxidation carries no flux, which is why omitting it from the fitted model produced
# no residual and S6-01 was inert. In the unadapted baseline it carries all of it. The
# acetate differs by 6.5x between them at the same gas rate, which is why the numbers are
# here and not in the visible contract.
plant: A
version: 1
baselines:
  - name: adapted
    adaptation:
      K_I_nh3: 0.02        # DESIGN  kmol N/m3; lead's ruling 2 range 0.02-0.05, bottom
      source: "lead's ruling 2 of 2026-09-03 on the evidence of Tisocco et al. 2024 (AFBI digestate TAN 2.3-4.3 kg N/m3 with stable production); ADM1/BSM2 default is 0.0018"
      note: "Plants B and C declare no adaptation and keep the ADM1 default: Muscatine's free ammonia is an order of magnitude below the pathway-shift window."
    expected_digestate_tan:
      median: 3.703        # MEASURED  kg N/m3; 180-d run, seed 1000, settled from d30; re-measured 2026-09-10 (was 3.695)
      p10: 3.640
      p90: 3.771
      unit: "kg N/m3"
      source: "measured through sim.run.harness.simulate_truth on the current feed (2026-09-10; was 3.695 / 3.588 / 3.788 on the pre-calcium feed); inside Tisocco et al. 2024's published 2.3-4.3"
    measured:              # MEASURED, 2026-09-10, medians from day 30 (see the table above)
      X_ac_kg_cod_m3: 1.065
      X_sao_kg_cod_m3: 6.9e-05
      sao_share: 0.000
      acetate_kg_m3: 0.037
      pH: 7.73
      ch4_fraction: 0.629
    note: "Acetoclastic: X_ac 1.06 against X_sao 7e-5, so the syntrophic pathway is present but carries no flux. S5-01 and S7-02 are staged here, because a LOSS of adaptation is what those rows inject; S6-04 too, where the omitted pathway carries nothing."
  - name: unadapted
    adaptation: null       # the ADM1/BSM2 default K_I_nh3 = 0.0018 kmol N/m3
    expected_digestate_tan:
      median: 3.614        # MEASURED  kg N/m3; 180-d run, seed 1000, settled from d30; re-measured 2026-09-10 (was 3.605 / 3.505 / 3.689)
      p10: 3.556
      p90: 3.677
      unit: "kg N/m3"
      source: "measured as above. RULED 2026-09-09: the measured 3.5-3.7 is ACCEPTED and the lead's earlier 3.7-4.3 for this variant is WITHDRAWN, so ruling and plant contract now agree. The unadapted constant does not raise TAN -- it is slightly LOWER than the adapted baseline's, because the pathway change does not add nitrogen -- and reaching 3.7-4.3 would have needed the frozen Plant A feed nitrogen to move. Still inside Tisocco et al. 2024's published 2.3-4.3."
    measured:              # MEASURED, 2026-09-10, medians from day 30
      X_ac_kg_cod_m3: 0.0019
      X_sao_kg_cod_m3: 0.853
      sao_share: 0.998
      acetate_kg_m3: 0.240
      pH: 7.72
      ch4_fraction: 0.628
    note: "The acetoclasts have washed out (X_ac 1.9e-3) and syntrophic acetate oxidation carries the entire acetate flux (X_sao 0.85). Still a sound digester -- pH 7.72, CH4 0.628 -- but a structurally different one, and the baseline S6-01 is staged on so that omitting SAO from the fitted model actually bites."
note: >-
  Truth-side since the lead's ruling B5 of 2026-09-10. The visible contract declares the
  two states qualitatively; this file says what they are.
