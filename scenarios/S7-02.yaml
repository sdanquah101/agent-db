# Level 7 — compound: structural AND parameter. The ladder's "SAO omitted and inhibition
# shift ... partial attribution; explicit abstention on the confounded part"; truth label
# `structural` + `parameter`. The third of the three AMMONIA scenarios and therefore PLANT
# A ONLY, and the hardest row in the library: one of the two faults is diagnosable and the
# other is not, and the scored property is whether the workflow knows which is which.
#
# It is the superposition of S6-01 and S5-01 at their own magnitudes and onsets:
#
#   omitted_sao               from t = 0                       (as S6-01)
#   ammonia_inhibition_shift  x0.1 on K_I_nh3 at day 120       (as S5-01)
#
# AND THE TWO INTERACT, which is what the 2026-09-03 redesign was for (the lead's
# ruling 2). Plant A starts adapted and acetoclastic. The loss of adaptation at day 120
# takes the inhibition constant below the pathway-exchange threshold, and syntrophic
# acetate oxidation begins to grow in behind the inhibited acetoclasts. The fitted model
# has no SAO at all, so the structural error is not a static offset but one that grows as
# the truth's route to methane changes underneath it -- SLOWLY, as measured. That is why
# Plant A's horizon is a year (the lead's rulings 3 and 4, 2026-09-11): the shift needs it.
#
# MEASURED (2026-09-11, the harness at this scenario's own seed, current feed, the
# prefix-stable generator of ruling 1, 365 d). ONSET day 120 of 365. The loss of
# adaptation starts the shift and, on the year, COMPLETES it: X_sao reaches 0.60 on day
# 348 and X_ac falls to 0.46 on day 350; SAO carries half the acetate-consuming biomass
# from day 338 and 65 % at the end (X_ac 0.371 against X_sao 0.691). Acetate goes from
# 0.04 kg COD/m3 before the onset to a peak of 3.9 on day 158 and back to 0.31 at the end
# as the oxidisers take the flux; the run is sound throughout (pH 7.70, CH4 0.62 at the end).
#
#   day    X_ac    X_sao   SAO share   acetate kg COD/m3
#   119    1.177   0.0001   0.0 %       0.04       (the adapted regime)
#   180    1.240   0.003    0.2 %       1.39
#   240    1.150   0.045    3.8 %       1.51
#   270    1.070   0.145   11.9 %       1.61
#   300    0.837   0.311   27.1 %       0.99
#   330    0.580   0.481   45.4 %       0.38
#   365    0.371   0.691   65.1 %       0.31
#
# So the record's 0.60 / 0.46 IS reached, by day ~350: the figure first recorded on
# 2026-09-03 as "in 240 d" was not reproducible at any commit (corrected 2026-09-10; at
# 200 / 220 / 240 d the share is 0.4 / 1.0 / 3.2 %), and the year is what it takes. The
# structural half of this row therefore rests on a pathway that carries a few per cent of
# the flux until day ~250, a quarter by day 300 and the majority from day ~340: a
# structural residual that is a RAMP through the last four months, on acetate first and on
# the gas as the route changes. S5-01, the same transition without the omission, reaches
# 0.60 / 0.46 fifty days earlier (day 298 / 302; see that file) -- the two rows differ in
# the fitted model, not in the truth's timing beyond that.
#
# WHY `kinetic_update_allowed` IS TRUE HERE and false in S6-01: the truth label carries
# `parameter` as well as `structural`, so a bounded update of the ammonia-inhibition
# constant is a correct action, and the scenario schema permits it for exactly that reason.
# What is NOT permitted is treating the structural residual as a parameter problem too,
# which is what `abstain_on` pins down.
id: S7-02
plant: A
# stated rather than inherited from the plant's default: this row injects a LOSS
# of adaptation, so it only means anything staged on the adapted baseline
baseline: adapted
tier: C
level: 7
duration_days: 365
truth_label: [structural, parameter]
faults:
  - type: omitted_sao
    onset_day: 0
    magnitude: 0.0
  - type: ammonia_inhibition_shift
    onset_day: 120
    magnitude: 0.1
correct_conclusion:
  flag_sensor: null
  estimate_scale_factor: false
  kinetic_update_allowed: true
  abstain_on: [acetate_speciation, methanogenic_pathway_split, inhibition_constant_magnitude]
  recommend_structural_review: true
budget:
  simulator_evals: 8000
  wall_clock_min: 150
  assay_units: 6
seed: 1072
notes: >-
  What a workflow should notice: a step at day 120 after which acetate climbs - the
  inhibition shift - and, on top of it, a residual that GROWS through the second half of
  the run and that no admissible parameter set removes, because the truth is rerouting its
  acetate through a pathway the fitted model does not have. The two have different time
  signatures: the parameter change is a step, the structural error is a ramp that follows
  the growing oxidiser population. The correct conclusion is PARTIAL: report the structural
  mismatch and recommend a model revision, report that a bounded change in the
  ammonia-inhibition constant occurred around day 120, and abstain explicitly on its
  MAGNITUDE, because a fitted inhibition constant in a model missing the oxidative route
  absorbs part of that route and cannot be believed as a number. Two characteristic
  failures: reporting a confident value for the shifted constant (the confounded quantity),
  and reporting only the structural mismatch, which is defensible but misses a real,
  detectable parameter change.
