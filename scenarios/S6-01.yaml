# Level 6 — omitted SAO pathway. The ladder's "truth includes SAO; fitted model does not";
# truth label `structural`. The second of the three AMMONIA scenarios and therefore PLANT
# A ONLY: syntrophic acetate oxidation only takes over where free ammonia is high enough
# to suppress the acetoclastic route, which is Plant A's 180-250 mg NH3-N/L and not
# Muscatine's (decisions log, 2026-09-02).
#
# NO MAGNITUDE. sim/faults/schema.py says so: the fault is the omission itself. The truth
# model keeps the `sao` extension - every plant declares all four - and the FITTED model
# is denied it. The magnitude is written as 0.0 because the schema requires a number.
#
# THIS ROW IS NEVER SCORED ON PARAMETER RECOVERY (CLAUDE.md, domain reminders; §6.7 A).
# When the truth has a pathway the fitted model lacks, "the right value" of a parameter
# does not exist, and the schema enforces the consequence: a purely structural scenario
# may not declare a kinetic update as correct.
#
# ============================ FLAGGED FOR THE LEAD ============================
# THIS ROW IS CURRENTLY INERT AND THE FIX NEEDS A DECISION (gate G1, 2026-09-03).
#
# The lead's ruling 2 asked for the three ammonia rows to be staged from a steady state
# with BOTH acetoclasts and SAO present. Measured, that state does not exist: the two
# compete for one substrate, so one always excludes the other, and the exchange happens at
# K_I_nh3 ~ 0.003 kmol N/m3 - an order of magnitude below the adapted range 0.02-0.05 the
# ruling sets. Reducing `k_m_sao` towards 3.0, the ruling's own fallback, moves the
# threshold DOWN and so makes coexistence harder rather than easier.
#
# S5-01 and S7-02 are fine, because they are TRANSITIONS: a loss of adaptation at the onset
# day drives the pathway shift inside the run. This row has no transition by construction -
# it is the pure structural omission - so at Plant A's adapted, acetoclastic baseline the
# truth's SAO carries no flux, and a fitted model that omits it produces NO residual. The
# row generates, and it currently tests nothing.
#
# Three ways out, for the lead:
#   (a) set Plant A's adapted K_I_nh3 to ~0.003, the exchange point, so both pathways are
#       live at baseline. Outside the ruled range, and structurally fragile: it is the
#       knife edge of a competitive exclusion, so any change to feed or kinetics flips it.
#   (b) give this row the same loss-of-adaptation transition, and accept that its label
#       becomes `structural + parameter` - at which point it duplicates S7-02.
#   (c) keep it as written and rescore it as an ABSTENTION row: the fitted model omits a
#       pathway that carries no flux, so the correct conclusion is that no structural
#       residual is detectable. That is a legitimate thing to test and is not the §6.3 row.
# This session recommends (a) or (c) and has changed nothing pending the answer.
# ==============================================================================
