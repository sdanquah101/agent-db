# Truth-model extensions (proposal §6.1): the truth model is standard ADM1 plus these,
# so that the fitted model (standard or simplified ADM1) is structurally wrong by design.
#
# Same conventions as petersen_matrix.yaml: components carry unit and COD/C/N/charge
# contents; process stoichiometry is expression-valued over parameter names (base
# parameters plus the extension's own), S_IC and S_IN written out explicitly; rate
# expressions are documentation, the code is in sim/adm1/extensions.py. Extension
# parameters carry a unit and a source. All four are off unless enabled when compiling
# the extended model. With an extension enabled but its rate parameters at zero, the
# model reproduces standard ADM1 (tests/test_adm1_extensions.py).
#
# Parameter values are literature order-of-magnitude STARTING values for scenario
# generation and are flagged for the external AD reviewer (proposal §9.4). The hidden
# per-scenario truth values are drawn by the scenario generator, never here.

version: 2

# Constants used by more than one extension. Always loaded; overridable like any
# extension parameter.
shared_parameters:
  pK_a2_co2: {value: 10.33, unit: "-", description: "HCO3- / CO3 2- at 25 C (Stumm & Morgan; not T-corrected, ~10.25 at 35 C)"}

extensions:

  # ---------------------------------------------------------------------------------
  # Syntrophic acetate oxidation (SAO): acetate -> 4 H2 + 2 CO2 by X_sao, coupled to
  # hydrogenotrophic methanogenesis. The dominant acetate sink under high free ammonia,
  # when acetoclastic methanogens are inhibited (Schnuerer & Nordberg 2008; Westerholm
  # et al. 2016). On a COD basis 1 kg COD acetate -> 1 kg COD H2 (CO2 carries no COD);
  # carbon closes on S_IC, nitrogen on S_IN through the biomass yield. Kinetics: Monod on
  # acetate with the standard pH_aa / IN inhibitions, a SEPARATE, WEAKER free-ammonia
  # inhibition (lead's decision 2026-09-02: SAO organisms are ammonia-tolerant but not
  # immune), and H2 product inhibition as for the other syntrophs, so SAO only runs
  # while hydrogenotrophs keep H2 low.
  #
  # K_I_nh3_sao = 0.05 kmol N/m3 (50 % at ~700 mg NH3-N/L, ~28x the BSM2 acetoclastic
  # K_I_nh3 of 25 mg/L). Chosen so that the model reproduces SAO dominance where it is
  # observed (TAN 3-5 g/L, free ammonia 200-400 mg/L, HRT 40-60 d; Schnuerer & Nordberg
  # 2008, Westerholm et al. 2016): with mu_max 0.08 d^-1 and decay 0.02 d^-1 SAO must keep
  # >~ 70 % of its rate at 250 mg/L free ammonia to out-grow a 60-d HRT at all. A tighter
  # constant (e.g. 4x acetoclastic, 100 mg/L) makes SAO unable to establish in any
  # ammonia-stressed digester in this model. Order of magnitude; for review.
  sao:
    description: syntrophic acetate oxidation as a separate pathway and biomass
    components:
      - {name: X_sao, unit: kg COD m^-3, description: syntrophic acetate oxidisers, cod: 1, carbon: C_bac, nitrogen: N_bac, charge: 0}
    parameters:
      # mu_max = Y_sao * k_m_sao = 0.16 d^-1 (doubling 4.3 d): the fast end of the 3-20 d
      # generation times measured for SAO co-cultures (Westerholm et al. 2019, Environ.
      # Sci. Technol. 53, doi:10.1021/acs.est.9b00288). Lead's decision 2026-09-02 (plant
      # configurations, answer 1): raised from 2.0 (mu_max 0.08, the 9-28 d figure of the
      # 2016 review) so that SAO establishes at Plant A's 35-45 d HRT under 180-250 mg/L
      # free ammonia within a 180-d scenario (S_ac 10-20 -> 0.4-1.6 kg COD/m3; verified by
      # tests/test_plants.py) while still washing out at the BSM2 20-d HRT.
      Y_sao:      {value: 0.04,   unit: kg COD_X kg COD_S^-1, description: "low syntrophic yield"}
      k_m_sao:    {value: 4.0,    unit: kg COD_S kg COD_X^-1 d^-1, description: "half the acetoclastic k_m_ac; mu_max 0.16 d^-1 (Westerholm et al. 2019 fast end)"}
      K_S_sao:    {value: 0.4,    unit: kg COD m^-3, description: "half-saturation on acetate"}
      K_I_nh3_sao: {value: 0.05,   unit: kmol N m^-3, description: "free-ammonia inhibition (50 % at ~700 mg NH3-N/L), ~28x acetoclastic K_I_nh3; order of magnitude, for review"}
      K_I_h2_sao: {value: 3.5e-6, unit: kg COD m^-3, description: "H2 product inhibition (50 %), as propionate syntrophs"}
      k_dec_X_sao: {value: 0.02,  unit: d^-1, description: "decay, as other biomass"}
    processes:
      - name: uptake_acetate_sao
        rate: k_m_sao * S_ac/(K_S_sao + S_ac) * X_sao * I_pH_h2 * I_IN_lim * I_nh3_sao * I_h2_sao
        stoichiometry:
          S_ac:  "-1"
          S_h2:  "1 - Y_sao"
          X_sao: "Y_sao"
          S_IC:  "C_ac - Y_sao*C_bac"
          S_IN:  "-Y_sao*N_bac"
      - name: decay_X_sao
        rate: k_dec_X_sao * X_sao
        stoichiometry: {X_sao: "-1", X_xc: "1", S_IC: "C_bac - C_xc", S_IN: "N_bac - N_xc"}

  # ---------------------------------------------------------------------------------
  # Ionic-strength correction: Davies activity coefficients applied to every acid-base
  # constant in the speciation (pK' = pK + correction), the ionic strength computed from
  # the charged species in the charge balance (strong ions monovalent), and pH reported
  # and inhibition evaluated on the proton ACTIVITY, as a probe would report it. Standard
  # ADM1 assumes an ideal solution; at the ionic strengths of manure and food-waste
  # digesters (0.1-0.5 M) this shifts pH and free ammonia by amounts that matter for
  # inhibition (Batstone et al. 2012; Flores-Alsina et al. 2016). No new components.
  #
  # Strong-ion convention (documented, lead's decision 2026-09-02): S_cat and S_an are
  # the standard ADM1 lumped monovalent strong cations / anions (kmol charge m^-3) and
  # enter I with z = 1, i.e. as Na+/K+ and Cl-. Divalent strong ions (Mg2+, SO4 2-) are
  # not represented; a feed rich in them understates I by up to a factor of ~2 per
  # divalent equivalent. Ca2+ from the calcite extension is the only divalent ion in I.
  #
  # davies_A is the 25 C value; the model scales it to T_op with the Debye-Hueckel
  # formula A = 1.82483e6 sqrt(rho) / (eps T)^1.5 (sim/adm1/physchem_ext.py): x1.017 at
  # 35 C, x1.056 at 55 C. Using the 25 C constant unscaled would understate log10(gamma)
  # by 5.6 % in a thermophilic digester.
  ionic_strength:
    description: Davies activity correction of all acid-base equilibria
    speciation: {ionic_strength: true}
    parameters:
      davies_A: {value: 0.5085, unit: "kg^0.5 mol^-0.5", description: "Debye-Hueckel A at 25 C (Stumm & Morgan); scaled to T_op by the model"}
      davies_b: {value: 0.3,    unit: "-", description: "Davies linear term"}
      I_max:    {value: 0.5,    unit: mol L^-1, description: "cap on I: Davies is unreliable above ~0.5 M"}

  # ---------------------------------------------------------------------------------
  # Carbonate second dissociation, HCO3- -> CO3 2- + H+, in the charge balance and the
  # inorganic-carbon split (CO2 / HCO3- / CO3 2- with the exact three-species
  # denominator). Standard ADM1 stops at bicarbonate; at digester pH the carbonate
  # fraction is ~0.1 % of bicarbonate, so this is a small but genuine model change
  # (pH shifts by a few thousandths). Its own switch, default off, so that the calcite
  # extension can be enabled without changing the base speciation (lead's decision
  # 2026-09-02): without it, the calcite rate uses the DIAGNOSTIC carbonate
  # K_a2 [HCO3-] / [H+], which is reported but takes no part in the balance. No new
  # components; pK_a2_co2 is a shared parameter.
  carbonate:
    description: second carbonic-acid dissociation in the charge balance and S_IC split
    speciation: {carbonate: true}

  # ---------------------------------------------------------------------------------
  # Precipitation / inorganic-carbon sink: calcite (CaCO3), the simplest of the
  # Flores-Alsina et al. (2016) minerals, with saturation-index kinetics (Koutsoukos 1980
  # form used by ADM1-P; kept as is, lead's decision 2026-09-02). Adds dissolved calcium
  # (charge +2, in the charge balance) and a mineral state; carbonate for the saturation
  # index comes from the `carbonate` extension when enabled, else from the diagnostic
  # estimate. Removes inorganic carbon and alkalinity, so a fitted model without it sees
  # an unattributable alkalinity/pH residual (Level-6 scenario "Omitted precipitation").
  #
  # Deliberate simplifications (lead's decision 2026-09-02), documented rather than
  # modelled: (1) no surface / seed term: the rate does not depend on the calcite
  # already present; (2) no dissolution: the rate is zero for SI < 1, and the model
  # reports `calcite_SI` and the flag `calcite_undersaturated` (1 when SI < 1 while
  # X_caco3 > 0, i.e. where dissolution would occur) so that runs which enter that
  # regime are visible; (3) no solids retention: X_caco3 leaves with the liquid at the
  # HRT. K_sp is temperature-dependent through Plummer & Busenberg (1982),
  # log10 K_sp = -171.9065 - 0.077993 T + 2839.319/T + 71.595 log10 T (pK 8.480 at 25 C,
  # 8.543 at 35 C, 8.709 at 55 C), evaluated at T_op in sim/adm1/physchem_ext.py; it is
  # therefore not a config parameter. pK_a2 (shared) is still the 25 C value.
  #
  # Charge convention: the row {S_ca: -1, S_IC: -1, X_caco3: +1} has a charge residual
  # of -2. This is a MATRIX CONVENTION, not a tested property: S_IC carries charge 0 as
  # an uncharged total (its split into CO2 / HCO3- / CO3 2- is algebraic), while the
  # species that actually leaves is CO3 2-. Electroneutrality of the solution is enforced
  # by the pH solver whatever the row says. The conservation test asserts -2 for this
  # row; the calcium balance and the 2 eq/mol alkalinity drop are tested dynamically.
  precipitation:
    description: calcite precipitation as an inorganic-carbon and alkalinity sink
    components:
      - {name: S_ca,    unit: kmol m^-3, description: dissolved calcium,       cod: 0, carbon: 0, nitrogen: 0, charge: 2}
      - {name: X_caco3, unit: kmol m^-3, description: calcium carbonate solid, cod: 0, carbon: 1, nitrogen: 0, charge: 0}
    parameters:
      k_prec_caco3: {value: 1.0, unit: kmol m^-3 d^-1, description: "kinetic constant (order of magnitude; ADM1-P uses 1e0-1e2)"}
      n_prec_caco3: {value: 2.0, unit: "-", description: "exponent on (SI^(1/2) - 1)"}
    processes:
      - name: precipitation_caco3
        rate: k_prec_caco3 * (sqrt(a_Ca * a_CO3 / K_sp) - 1)^n_prec_caco3 for SI > 1, else 0
        stoichiometry: {S_ca: "-1", X_caco3: "1", S_IC: "-1"}
