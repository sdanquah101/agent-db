# Observation model: sensor specifications and instrumentation tiers (proposal §6.1, §6.4).
# Schema: sim/observation/schema.py. Loaded by sim.observation.load_observation_config.
#
# STATUS: every value is `# DESIGN` and awaits the lead's review. Two channels are
# ANCHORED to the Muscatine 1-minute SCADA file and re-derived by tests/test_observation.py
# (anchor/ingest_muscatine.py::scada_noise_statistics); everything else is ASSUMED with
# the reason beside it.
#
# WHAT THE ANCHOR GIVES (SCADA-raw.csv, 500,400 rows at 1 min, one year, two digesters;
# ODC-By 1.0, anchor/MANIFEST.json):
#   * digester temperature: 1-minute noise sigma 0.052 degF = 0.029 K (robust estimate:
#     1.4826 x MAD of the first difference / sqrt(2), which is insensitive to the real
#     process movement underneath); stuck-value runs of >= 10 min are 0.08 % of the time.
#   * total biogas flow: 1-minute noise sigma 2.35 cfm on a mean of 112.8 cfm = 2.1 %
#     relative; stuck-value runs of >= 10 min are 0.01 % of the time.
#   * MISSINGNESS CANNOT BE ANCHORED: the provider pre-cleaned the SCADA file and the two
#     columns are 100 % finite, so every dropout and every missingness rate below is
#     ASSUMED. Flagged for the lead.
#
# CONVENTIONS (CLAUDE.md rule 6). Gas volumes carry `gas_convention`: `stp_dry` is 0 degC,
# 1 atm, water vapour removed; `operating_wet` is the BSM2 meter convention (T_op, P_atm,
# wet). Gas fractions are mole fractions of the DRY gas. Solids carry `solids_basis`.
# The plant's own biogas meter is modelled as `stp_dry` because that is what a corrected
# volume means; a scenario that wants an uncorrected meter injects `gas_meter_scale`.
#
# NOT MODELLED, and why: H2S (no sulfur in ADM1, so the Tier-C off-gas H2S of §6.4 has no
# truth to observe - declared here rather than faked); reactor temperature varies only as
# sensor noise because the truth model integrates at a fixed set point (the plant's
# day_sd_K belongs to the heating model, which is not built).

version: 1

# When the condition flags that drive missingness are raised (proposal §6.1: "instruments
# are more likely to fail during foaming and overload").
conditions:
  fos_tac_overload: 0.40      # DESIGN  -; ANCHORED: the Muscatine daily file's own FOS/TAC
                              # (Dig1-FOS-TAC, n = 861) has median 0.23, p90 0.37, p95 0.44,
                              # max 0.93, so 0.40 is the ~92nd percentile: an overload flag
                              # that is raised on roughly 8 % of days at a real co-digestion
                              # plant. Our channel reproduces the plant's own column to
                              # r = 0.99 from its VFA and alkalinity (sim.observation.channels).
  fos_tac_foaming: 0.30       # DESIGN  -; ASSUMED: the ~78th percentile of the same column;
                              # foaming needs acidification AND a gas surge, so its FOS/TAC
                              # threshold is lower than the overload one.
  gas_surge_ratio: 1.35       # DESIGN  -; ASSUMED: gas rate 35 % above its own trailing
                              # median. Not anchored: Muscatine records no foaming events.
  gas_median_window_d: 14.0   # DESIGN  d; ASSUMED: two weeks of trailing gas history.
  source: "fos_tac_overload ANCHORED to muscatine_daily Dig1-FOS-TAC; the foaming rule is ASSUMED"

sensors:
  # ------------------------------------------------------------------ Tier A (online)
  temperature:
    name: temperature
    channel: temperature
    kind: online
    unit: K
    sampling_interval_d: 1.0    # DESIGN  d; daily mean of the 1-minute SCADA record
    lag_d: 0.0                  # DESIGN  d; online
    noise:
      cv: 0.0
      sd_abs: 0.03              # DESIGN  K; ANCHORED: 1-minute sigma 0.029 K from SCADA-raw
                                # (robust first-difference estimate). Kept at the 1-minute
                                # value rather than divided by sqrt(1440) for a daily mean,
                                # because a daily mean of a drifting probe is not sqrt-n
                                # better; ASSUMED conservative.
      source: "muscatine_scada: D1_TEMPERATURE / D2_TEMPERATURE"
    drift:
      sd_per_sqrt_d: 0.01       # DESIGN  K/sqrt(d); ASSUMED: a PT100 in a digester drifts
                                # slowly and is rarely recalibrated
      bound: 1.0                # DESIGN  K; ASSUMED
      recalibration_interval_d: null
      source: ASSUMED
    flatline:
      hazard_per_d: 0.002       # DESIGN  1/d; ANCHORED (order of magnitude): stuck runs of
                                # >= 10 min are 0.08 % of the SCADA record; at a mean episode
                                # of 0.4 d this reproduces that occupancy
      mean_duration_d: 0.4      # DESIGN  d; ANCHORED: the longest stuck run is 149 min
      source: "muscatine_scada: consecutive identical D1_TEMPERATURE values"
    saturation: {low: 273.15, high: 353.15}   # DESIGN  K; ASSUMED: the SCADA dictionary's
                                              # acceptable range is 85-150 degF (302-339 K)
    missingness:
      base_rate: 0.01           # DESIGN  -; ASSUMED (the SCADA file is pre-cleaned, so no
                                # dropout statistics exist)
      stress_multipliers: {overload: 2.0, foaming: 3.0}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: "noise and flatline ANCHORED to muscatine_scada; drift and missingness ASSUMED"

  ph:
    name: ph
    channel: pH
    kind: online
    unit: pH units
    sampling_interval_d: 1.0    # DESIGN  d; §6.4 Tier A: daily pH
    lag_d: 0.0
    noise:
      cv: 0.0
      sd_abs: 0.02              # DESIGN  pH units; ASSUMED: a clean industrial electrode
      source: ASSUMED
    drift:
      sd_per_sqrt_d: 0.01       # DESIGN  pH units/sqrt(d); ASSUMED: electrode ageing. This
                                # is the sensor's OWN slow drift; the Level-2 scenario's
                                # deliberate drift is injected on top (sim.faults).
      bound: 0.5                # DESIGN  pH units; ASSUMED
      recalibration_interval_d: 30.0   # DESIGN  d; ASSUMED: monthly calibration, which is
                                       # what makes the drift-then-step signature of §6.3
      source: ASSUMED
    fouling:
      hazard_per_d: 0.005       # DESIGN  1/d; ASSUMED: biofilm on the probe
      mean_duration_d: 7.0      # DESIGN  d; ASSUMED: until the next manual clean
      gain: 1.0                 # DESIGN  -; fouling of a pH probe is an offset, not a gain
      offset: -0.15             # DESIGN  pH units; ASSUMED: a fouled electrode reads low
      source: ASSUMED
    saturation: {low: 0.0, high: 14.0}   # DESIGN  pH units; the instrument's range
    missingness:
      base_rate: 0.02           # DESIGN  -; ASSUMED. Muscatine's daily pH column is missing
                                # on 0.9 % of days, but that is a lab record, not this probe.
      stress_multipliers: {overload: 2.0, foaming: 5.0}   # DESIGN  -; ASSUMED: a foaming
                                # digester coats the probe
      source: ASSUMED
    source: ASSUMED

  gas_flow:
    name: gas_flow
    channel: q_gas_stp_dry
    kind: online
    unit: m3/d
    gas_convention: stp_dry     # corrected volume: 0 degC, 1 atm, dry
    sampling_interval_d: 1.0    # DESIGN  d; §6.4 Tier A: daily corrected biogas volume
    lag_d: 0.0
    noise:
      cv: 0.021                 # DESIGN  -; ANCHORED: 1-minute sigma 2.35 cfm on a mean of
                                # 112.8 cfm (Biogas column, robust first-difference estimate)
      sd_abs: 0.0
      source: "muscatine_scada: Biogas"
    drift:
      sd_per_sqrt_d: 0.0        # DESIGN  m3/d per sqrt(d); a thermal mass meter's error is a
                                # SCALE error, injected as the Level-2 gas_meter_scale fault,
                                # not a random walk
      bound: 0.0
      source: "no zero drift by design; scale error is a fault"
    flatline:
      hazard_per_d: 0.0005      # DESIGN  1/d; ANCHORED (order of magnitude): stuck runs of
                                # >= 10 min are 0.01 % of the SCADA record
      mean_duration_d: 0.2      # DESIGN  d; ANCHORED: the longest stuck run is 72 min
      source: "muscatine_scada: consecutive identical Biogas values"
    saturation: {low: 0.0, high: null}   # DESIGN  m3/d; a flow meter cannot read negative
    missingness:
      base_rate: 0.01           # DESIGN  -; ASSUMED
      stress_multipliers: {overload: 2.0, foaming: 4.0}   # DESIGN  -; ASSUMED: foam carried
                                # into the gas line fouls the meter
      source: ASSUMED
    source: "noise and flatline ANCHORED to muscatine_scada; missingness ASSUMED"

  # ------------------------------------------------------------------ Tier B adds
  ch4_fraction:
    name: ch4_fraction
    channel: ch4_fraction
    kind: online
    unit: "- (mole fraction of dry gas)"
    gas_convention: stp_dry
    sampling_interval_d: 1.0    # DESIGN  d; §6.4 Tier B: continuous CH4 fraction, reported daily
    lag_d: 0.0
    noise:
      cv: 0.01                  # DESIGN  -; ASSUMED: an in-line IR analyser, ~1 % of reading
      sd_abs: 0.0
      source: ASSUMED
    drift:
      sd_per_sqrt_d: 0.001      # DESIGN  fraction/sqrt(d); ASSUMED: IR zero drift
      bound: 0.03               # DESIGN  fraction; ASSUMED
      recalibration_interval_d: 90.0   # DESIGN  d; ASSUMED: quarterly span check
      source: ASSUMED
    flatline:
      hazard_per_d: 0.002       # DESIGN  1/d; ASSUMED: the Level-2 scenario injects a
                                # 6-day flatline deliberately; this is the background rate
      mean_duration_d: 0.5      # DESIGN  d; ASSUMED
      source: ASSUMED
    saturation: {low: 0.0, high: 1.0}    # DESIGN  fraction
    missingness:
      base_rate: 0.02           # DESIGN  -; ASSUMED
      stress_multipliers: {overload: 2.0, foaming: 6.0}   # DESIGN  -; ASSUMED: the analyser
                                # is the first instrument foam takes out
      source: ASSUMED
    source: ASSUMED

  alkalinity:
    name: alkalinity
    channel: alkalinity_total
    kind: lab
    unit: kg CaCO3/m3
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier B: weekly alkalinity. Muscatine
                                # measures it on 87-94 % of weekdays; weekly is the tier's rule
    lag_d: 1.0                  # DESIGN  d; ASSUMED: titration reported next day
    noise:
      cv: 0.05                  # DESIGN  -; ASSUMED: titration repeatability
      sd_abs: 0.0
      source: ASSUMED
    missingness:
      base_rate: 0.05           # DESIGN  -; ASSUMED. Muscatine's alkalinity column is
                                # missing on 13 % of days, but that includes weekends
      stress_multipliers: {overload: 1.5}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: ASSUMED

  vfa_total:
    name: vfa_total
    channel: vfa_total
    kind: lab
    unit: kg/m3 as acetic acid
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier B: weekly total VFA
    lag_d: 2.0                  # DESIGN  d; ASSUMED: GC turnaround
    noise:
      cv: 0.08                  # DESIGN  -; ASSUMED: GC on a digestate matrix
      sd_abs: 0.0
      source: ASSUMED
    missingness:
      base_rate: 0.05           # DESIGN  -; ASSUMED (Muscatine's VFA column: 22 % missing)
      stress_multipliers: {overload: 1.5}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: ASSUMED

  tan:
    name: tan
    channel: tan
    kind: lab
    unit: kg N/m3
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier B: weekly TAN. Tisocco 2024 §2.2.2
                                # samples the digestate weekly for NH4-N, which is the
                                # Plant-A anchor for this schedule
    lag_d: 1.0                  # DESIGN  d; ASSUMED
    noise:
      cv: 0.05                  # DESIGN  -; ASSUMED: gas-sensing electrode (tisocco_2024)
      sd_abs: 0.0
      source: "tisocco_2024 §2.2.1 method; cv ASSUMED"
    missingness:
      base_rate: 0.05           # DESIGN  -; ASSUMED
      stress_multipliers: {overload: 1.5}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: ASSUMED

  cod_total:
    name: cod_total
    channel: cod_total
    kind: lab
    unit: kg COD/m3
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier B: weekly COD
    lag_d: 3.0                  # DESIGN  d; ASSUMED
    noise:
      cv: 0.10                  # DESIGN  -; ASSUMED: dichromate COD on digestate
      sd_abs: 0.0
      source: ASSUMED
    missingness:
      base_rate: 0.05           # DESIGN  -; ASSUMED
      stress_multipliers: {overload: 1.5}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: ASSUMED

  # ------------------------------------------------------------------ Tier C adds
  vfa_ac:
    name: vfa_ac
    channel: vfa_ac
    kind: lab
    unit: kg/m3 as acetic acid
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier C: VFA speciation
    lag_d: 2.0
    noise: {cv: 0.10, sd_abs: 0.0, source: ASSUMED}
    missingness: {base_rate: 0.05, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED
  vfa_pro:
    name: vfa_pro
    channel: vfa_pro
    kind: lab
    unit: kg/m3 as propionic acid
    sampling_interval_d: 7.0
    lag_d: 2.0
    noise: {cv: 0.12, sd_abs: 0.0, source: ASSUMED}   # DESIGN  -; ASSUMED: propionate is the
                                                      # hardest of the four to quantify
    missingness: {base_rate: 0.05, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED
  vfa_bu:
    name: vfa_bu
    channel: vfa_bu
    kind: lab
    unit: kg/m3 as butyric acid
    sampling_interval_d: 7.0
    lag_d: 2.0
    noise: {cv: 0.12, sd_abs: 0.0, source: ASSUMED}
    missingness: {base_rate: 0.05, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED
  vfa_va:
    name: vfa_va
    channel: vfa_va
    kind: lab
    unit: kg/m3 as valeric acid
    sampling_interval_d: 7.0
    lag_d: 2.0
    noise: {cv: 0.15, sd_abs: 0.0, source: ASSUMED}   # DESIGN  -; ASSUMED: valerate sits at
                                                      # the quantification limit
    missingness: {base_rate: 0.08, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED
  h2_offgas:
    name: h2_offgas
    channel: h2_ppm
    kind: online
    unit: ppm by volume of dry gas
    gas_convention: stp_dry
    sampling_interval_d: 1.0    # DESIGN  d; §6.4 Tier C: off-gas H2
    lag_d: 0.0
    noise:
      cv: 0.15                  # DESIGN  -; ASSUMED: an electrochemical H2 cell is poor
      sd_abs: 1.0               # DESIGN  ppm; ASSUMED: its floor dominates at digester levels
      source: ASSUMED
    drift:
      sd_per_sqrt_d: 0.2        # DESIGN  ppm/sqrt(d); ASSUMED: electrochemical cells drift
      bound: 10.0               # DESIGN  ppm; ASSUMED
      recalibration_interval_d: 30.0   # DESIGN  d; ASSUMED
      source: ASSUMED
    saturation: {low: 0.0, high: 1000.0}   # DESIGN  ppm; ASSUMED cell range
    missingness:
      base_rate: 0.05           # DESIGN  -; ASSUMED
      stress_multipliers: {overload: 2.0, foaming: 6.0}   # DESIGN  -; ASSUMED
      source: ASSUMED
    source: ASSUMED
  digestate_vs:
    name: digestate_vs
    channel: vs
    kind: lab
    unit: kg VS/m3
    solids_basis: wet           # per m3 of digestate
    sampling_interval_d: 7.0    # DESIGN  d; §6.4 Tier C: richer fractionation
    lag_d: 1.0
    noise: {cv: 0.03, sd_abs: 0.0, source: ASSUMED}   # DESIGN  -; ASSUMED: gravimetric
    missingness: {base_rate: 0.05, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED
  digestate_ts:
    name: digestate_ts
    channel: ts
    kind: lab
    unit: kg TS/m3
    solids_basis: wet
    sampling_interval_d: 7.0
    lag_d: 1.0
    noise: {cv: 0.03, sd_abs: 0.0, source: ASSUMED}
    missingness: {base_rate: 0.05, stress_multipliers: {overload: 1.5}, source: ASSUMED}
    source: ASSUMED

# Tiers are OBSERVATION MASKS on identical truth (§6.4); each contains the one below
# (validated by the schema and tested). `feed_assays` names the influent generator's
# assays visible at the tier (sim/influent/generator.py, ASSAY_NAMES).
tiers:
  A:
    tier: A
    sensors: [temperature, ph, gas_flow]
    feed_assays: [ts, vs]
    note: >-
      §6.4 Tier A (constrained plant): feed mass, reactor temperature, daily pH, daily
      corrected biogas volume, weekly feed TS/VS. Feed mass is the operator's feed log
      (sim.influent.generator.OperatorRecord), not a sensor here.
  B:
    tier: B
    sensors: [temperature, ph, gas_flow, ch4_fraction, alkalinity, vfa_total, tan, cod_total]
    feed_assays: [ts, vs, cod, tkn, tan]
    note: "§6.4 Tier B: Tier A + continuous CH4 fraction, weekly alkalinity, total VFA, TAN, COD."
  C:
    tier: C
    sensors: [temperature, ph, gas_flow, ch4_fraction, alkalinity, vfa_total, tan, cod_total,
              vfa_ac, vfa_pro, vfa_bu, vfa_va, h2_offgas, digestate_vs, digestate_ts]
    feed_assays: [ts, vs, cod, tkn, tan, alkalinity, ph]
    note: >-
      §6.4 Tier C: Tier B + VFA speciation, richer fractionation (digestate TS/VS), off-gas
      H2. Off-gas H2S is NOT here: ADM1 has no sulfur, so there is no truth to observe;
      periodic activity tests are a requested assay (§6.4), not a scheduled sensor.
