                                 # daily file measures alkalinity in the DIGESTER (median
                                 # 5.04 kg CaCO3/m3), which fixes only the flow-weighted
                                 # strong-cation excess of the feed blend, not its split
                                 # between streams; the split is assumed. Most of it is put
                                 # on this stream because caustic from clean-in-place is the
                                 # usual source of alkalinity in food and beverage
                                 # industrial waste, and because at 137 kg COD/m3 this is by
                                 # far the most concentrated feed: 225 meq/L is ~5 g Na/L on
