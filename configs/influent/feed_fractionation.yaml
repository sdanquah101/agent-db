# Feed-fractionation catalogue for the influent generator (proposal §6.1).
#
# STATUS: EVERY VALUE HERE IS PROVISIONAL (docs/decisions.md, "Feed fractionation values
# are provisional pending lead review"). The frozen plant decision of 2026-09-02 (PR #6,
# answer 7 and the FeedStream docstring) deliberately deferred COD fractionation and assay
# statistics to the influent generator; the plant configurations carry feed identity and
# delivery pattern only. The numbers below started as the superseded PR #7's (branch
# claude/milestone-2-plants) and were revised by the influent-generator session on the
# lead's catalogue-consistency answers (docs/decisions.md, "Feed catalogue consistency"
# and the influent-generator session's entries); every changed value cites its reason
# beside it. Every numeric leaf is marked `# DESIGN`.
#
# Keys are the feed ids used by configs/plants/plant_{A,B,C}.yaml (FeedStream.name);
# `kind` must equal the plant's FeedStream.kind (checked by sim.influent). Two ids are
# renamed from PR #7 to match PR #6: hsw_liquid -> high_strength_waste, twas ->
# thickened_was. `food_waste` is carried from PR #7's Plant B although no frozen plant
# feeds it (Plant B is Muscatine co-digestion of sludge + HSW + FOG, answer 3).
#
# Basis conventions: `ts` is kg TS per kg wet feed (fresh-matter basis); `vs_of_ts` is
# kg VS per kg TS (dry basis); dissolved species per m3 of wet feed. COD equivalents of
# the four degradable classes (kg COD per kg of class,
# sim.influent.schema.COD_EQUIVALENTS_KG_COD_PER_KG): carbohydrates 1.19, proteins 1.42,
# lipids 2.90 (VDI 4630 theoretical methane yields 0.415 / 0.496 / 1.014 m3 CH4 STP per
# kg, divided by 0.35 m3 CH4 per kg COD) and VFA as acetate 1.07. The inert classes take
# the feed's own `inert_cod_equivalent` (next paragraph).
#
# COD/VS IS DERIVED, NEVER DECLARED (lead's decision 2026-09-02, "Feed catalogue
# consistency", answer 1): the derived value is 1 / sum_i(f_i / e_i) over the COD shares
# f_i and equivalents e_i. `cod_per_vs_literature` is the literature or measured value,
# a CHECK enforced by the schema and by tests/test_influent.py within
# `cod_per_vs_tolerance` (+/- 10 %). The derived value each fractionation gives is
# quoted beside the check field.
#
# THE INERT COD EQUIVALENT IS PER FEED (lead's freeze 2026-09-02, "Silage basis and
# per-feed inert COD equivalent"): `inert_cod_equivalent` is the kg COD per kg of inert
# VS mass used for f_xi and f_si, ~1.2 for lignocellulosic inerts (cattle slurry, grass
# silage) and 1.4-1.5 for sludge-derived inerts (the Muscatine feeds); FOG and food waste
# take the sludge value by the lead's instruction, documented as an assumption beside each
# value. The four degradable classes keep the fixed equivalents above.
#
# SILAGE BASIS (lead's freeze 2026-09-02): grass silage follows Tisocco et al. 2024
# throughout - TS as % of FRESH MATTER, every composition figure per kg TS, and
# VS = TS - ash (1000 - XA g/kg TS). The liquid-basis reading of the 2026 table's
# "g/L" rows is dropped. Every silage field is labelled with that basis below.
#
# `inert_N_I` (kmol N/kg COD) is the nitrogen content of this feed's inerts (X_I, S_I).
# Lead's decision 2026-09-02 (docs/decisions.md, "Per-feed inert nitrogen in the truth
# model"): the TRUTH model applies these per-feed values (sim.influent.nitrogen: the
# inert-COD-weighted mean of the fed feeds, a hidden truth parameter); the FITTED model
# keeps the ADM1 default (BSM2 0.06/14 = 0.00429, derived for sludge inerts). That gap is
# a deliberate structural mismatch of the kind the benchmark exists to expose; do not
# "fix" it by aligning the two. `tkn` is the TKN implied under the feed's own inert_N_I
# (within `tkn_tolerance`, tested), which is the TKN the generator reports as an assay.
#
# Nitrogen basis of the Plant A feeds (docs/decisions.md, "Tisocco 2024 Table 1 nitrogen
# is total N"): Tisocco et al. 2024 Table 1 row "NH4-N [g/kg TS]" (silage 25.6 / 21.8,
# slurry 65.3 / 57.8 for data sets A / B) is read as TOTAL (Kjeldahl) N per kg TS: for
# silage it equals XP/6.25 exactly (160/6.25 = 25.6, 135/6.25 = 21.6), the 2024 ESM feeds
# it to ADM1 as S_IN (silage 5.1 = 25.6 x 20.1 %), and the Foulum slurry's directly
# measured NH4-N (2026 Table 1: 1.08 g/L at 3.6 % TS = 30 g N/kg TS) is 0.49 of it, the
# literature TAN/TKN ratio of cattle slurry. `tkn` is that basis at the catalogue's own
# TS; `tan` is a cited TAN/TKN ratio times it. The "7.28 g/L" the 2026 Table 1 prints
# for grass-silage NH4-N (no footnote; the same table flags the silage acids as
# "reported in the source as g per kg TS") could not be traced to any arithmetic on the
# 2024 values and is DROPPED (decisions log).
#
# Sources:
#   T2024: Tisocco et al. 2024, Front. Environ. Sci. Eng. 18(4):50,
#          doi:10.1007/s11783-024-1810-9 (AFBI Hillsborough; §2.2.1, Table 1, ESM Table S2).
#   T2026: Tisocco et al. 2026, Environ. Sci. Ecotechnol. 29:100662,
#          doi:10.1016/j.ese.2026.100662 (AU Foulum; Table 1; PMC12874345).
#   Muscatine: Schroer & Just 2024, LABS-raw.csv (anchor/MANIFEST.json iowa-muscatine-wrrf);
#          Schroer & Just 2023 (PMC10928704).
#   Zhang et al. 2007, Bioresour. Technol. 98:929; Fisgativa et al. 2016, Waste Manag.
#          50:264; Bong et al. 2018, J. Clean. Prod. 172:1545 (food-waste composition).
#   Amon et al. 2007a, Agric. Ecosyst. Environ. 118:173 (cattle-manure BMP 0.13-0.25
#          m3 CH4/kg VS, cited in T2024 §3.3); Amon et al. 2007b (grass-silage BMP, cited
#          in the T2024 ESM Fig. S1); Xiao et al. 2021 (C/N).
#   Sommer & Husted 1995, J. Agric. Sci. 124:45 (cattle slurry TAN 50-60 % of total N);
#          Webb et al. 2010, Agric. Ecosyst. Environ. 137:39 (TAN/TN of cattle slurry).
#   McDonald, Henderson & Heron 1991, The Biochemistry of Silage, 2nd ed. (ammonia N
#          below 10 % of total N in well-preserved silage).
#   Tchobanoglous et al. 2014, Wastewater Engineering (Metcalf & Eddy), 5th ed., Ch. 14
#          (typical composition of untreated primary sludge: protein 20-30 % and grease
#          and fats up to ~30 % of dry solids).
#   Rosen & Jeppsson 2006 (BSM2 influent, as in scripts/adm1_candidates/common.py).

version: 2
feeds:
  # ------------------------------------------------------------------ Plant A feeds
  cattle_slurry:
    feed_id: cattle_slurry
    kind: slurry
    status: provisional
    description: >-
      Cattle slurry on the TISOCCO 2024 BASIS for solids and nitrogen (see the header
      note "SILAGE BASIS": the freeze names silage, and this entry follows it so that
      BOTH Plant A feeds share one basis and the plant reproduces its published OLR of
      1.4-2.1 kg VS/m3/d - on the mixed basis it fell to 1.17; FLAGGED FOR THE LEAD, who
      may revert this feed to the 2026 column). T2024 Table 1, means of data sets A / B:
      TS 6.8 / 7.5 % FM, XA 241, XC 609 / 595, XP 101 / 115, XL 48.5 g per kg TS, total N
      65.3 / 57.8 g per kg TS. The COD FRACTIONATION below is the lead's frozen one
      (inerts 0.40 on BMP evidence), whose class shares came from the 2026 Foulum column
      (XC 586.6, XP 124.0, XL 48.5 g/kg TS, DQ_XC 69 %, acids 4.5 kg COD/m3); the two
      tables' crude fractions agree to a few per cent, so the freeze is unaffected.
    density: 1000.0              # DESIGN  kg/m3; assumed: slurry is pumped as a liquid, taken as water
    ts: 0.0715                   # DESIGN  kg TS/kg wet (FRESH-MATTER basis, T2024 Table 1): mean of 6.8 and 7.5 % FM (was the 2026 Foulum 3.6 %)
    vs_of_ts: 0.759              # DESIGN  kg VS/kg TS (DRY basis, T2024 Table 1): VS = TS - ash = (1000 - 241 g XA per kg TS) / 1000
    inert_cod_equivalent: 1.2    # DESIGN  kg COD/kg VS mass; lignocellulosic inerts (lead's freeze): the non-degradable fraction of cattle slurry is undigested lignified fibre from the ration, ~1.2 g COD/g VS
    cod_per_vs_literature: 1.332 # DESIGN  kg COD/kg VS; CHECK, from the T2024 Table 1 crude fractions per kg TS (carbohydrate XC less the acids, protein XP, lipid XL, acids at their own equivalents, over VS 759 g/kg TS); the fractionation below derives 1.314 (-1.4 %) at this feed's inert equivalent of 1.2
    cod_per_vs_tolerance: 0.10   # DESIGN  -; lead's decision 2026-09-02 (+/- 10 %)
    ph: 7.5                      # DESIGN  pH; assumed: stored cattle slurry 7.2-7.8; not published
    fractionation:               # DESIGN  kg COD/kg COD; re-centred at inert 0.40 (lead's decision 2026-09-02, "Feed catalogue consistency", answer 2): cattle-slurry BMP 0.13-0.25 m3 CH4/kg VS (Amon et al. 2007a, cited in T2024 §3.3) against the theoretical 0.47 for this composition gives a non-degradable share of 0.45-0.70 on a BMP basis; 0.40 with the Dirichlet spread 0.30-0.50 (kappa 100, sd 0.05) is the lead's centre, and Tisocco's fitted DQ_XC 0.69 (inert 0.24 with these fractions) sits inside the spread's degradable end
      f_ch: 0.18                 #   carbohydrates: the balance after VFA 0.12, protein 0.17, lipid 0.13 and inerts 0.40 (the decisions entry wrote 0.16 with inerts 0.40, which does not sum to one; 0.18 keeps the inert share at the decided 0.40 and the measured classes as printed)
      f_pr: 0.17                 #   proteins, 2026 Table 1 XP (kept, as decided)
      f_li: 0.13                 #   lipids, 2026 Table 1 XL (kept, as decided)
      f_xi: 0.38                 #   particulate inerts: 0.40 total inerts (decided) less the soluble 0.02
      f_si: 0.02                 #   soluble inerts: assumed (humic-like solubles of slurry); not published
      f_vfa: 0.12                #   VFA as acetate: 2026 Table 1 acetic + propionic + valeric = 4.5 kg COD/m3 of 36.1 kg COD/m3 total (kept, as decided); T2024 Table 1 gives 4.75 + 0.6 + 1.3 + 0.2 g/kg TS, the same share to within a point
    fractionation_concentration: 100.0   # DESIGN  -; lead's decision 2026-09-02: kappa ~100 gives sd ~0.05 on the 0.40 inert share, i.e. 0.30-0.50 as +/- 2 sd (was 150)
    tan: 0.173                   # DESIGN  kmol N/m3; 0.55 x tkn (TAN/TKN of cattle slurry 0.5-0.6: Sommer & Husted 1995; Webb et al. 2010) = 2.42 g N/L; cross-check: the Foulum slurry's measured NH4-N of 1.08 g/L at its 3.6 % TS is 0.49 x its own total N
    tkn: 0.314                   # DESIGN  kmol N/m3; T2024 Table 1 total N (65.3 / 57.8 g N per kg TS, mean 61.6) x 71.5 g TS/kg FM = 4.40 g N/kg FM (/14.007), the value the 2024 ESM Table S2 lists as the slurry S_IN (4.35-5.95 kg N/m3); implied under inert_N_I and the fractionation: 0.286 (-9 %)
    tkn_tolerance: 0.15          # DESIGN  -; accepted gap between the declared TKN and the ADM1-implied one (tests/test_influent.py)
    inert_N_I: 0.001   # DESIGN  kmol N/kg COD; PR #7 Plant A override: assumed, lignocellulosic inerts of slurry and silage carry ~0.014 g N/g COD (BSM2 0.00429 is for sludge-derived inerts); applied by the truth model only (lead's decision)
    s_ic: 0.05                   # DESIGN  kmol C/m3; assumed: bicarbonate of stored cattle slurry (~3 g HCO3-/L); not published
    s_cat: 0.10                  # DESIGN  kmol/m3; assumed: Tisocco 2024 ESM Table S2 lists S_cat 0.2 mol/L "manually adjusted"; halved so the digester alkalinity lands at ~10 g CaCO3/L with the TAN below (PR #7 tests)
    s_an: 0.02                   # DESIGN  kmol/m3; assumed (Table S2: 0.015 mol/L, manually adjusted)
    s_ca: 0.04                   # DESIGN  kmol/m3; assumed: ~1.6 g Ca/L, order of magnitude for cattle slurry; not published
  grass_silage:
    feed_id: grass_silage
    kind: silage
    status: provisional
    description: >-
      Grass silage on the TISOCCO 2024 BASIS THROUGHOUT (lead's freeze 2026-09-02):
      TS as % of fresh matter, every composition figure per kg TS, VS = TS - ash.
      Table 1, means of data sets A / B: TS 20.1 / 25.2 % FM, XA 185, XC 624 / 653,
      XP 160 / 135, XL 31 / 27 g per kg TS; silage acids per kg TS acetic 20 / 31,
      butyric 1.8 / 1.0, propionic 0.6 / 1.0, lactic 97 / 116; total N 25.6 / 21.8 g
      per kg TS. Fed 2 t FM/d Monday-Friday at Hillsborough (2024 Section 2.1); the
      weekend omission is the influent generator's job. The 2026 Foulum column
      (TS 31.9 % FM, VS 87.7 % TS, "NH4-N 7.28 g/L") is NOT used for this feed.
    density: 1000.0              # DESIGN  kg/m3; assumed: the silage is mixed into the slurry, so its volume is taken at the slurry density (bulk density in the clamp is 600-800 kg/m3)
    ts: 0.2265                   # DESIGN  kg TS/kg wet (FRESH-MATTER basis, T2024 Table 1): mean of 20.1 and 25.2 % FM
    vs_of_ts: 0.815              # DESIGN  kg VS/kg TS (DRY basis, T2024 Table 1): VS = TS - ash = (1000 - 185 g XA per kg TS) / 1000
    inert_cod_equivalent: 1.2    # DESIGN  kg COD/kg VS mass; lignocellulosic inerts (lead's freeze): silage inerts are lignin-bound fibre, ~1.2 g COD/g VS, close to the carbohydrate equivalent
    cod_per_vs_literature: 1.274 # DESIGN  kg COD/kg VS; CHECK, derived from T2024 Table 1 per kg TS: carbohydrate (XC less the acids) 0.4898 kg, protein 0.1475, lipid 0.029, acids 0.1342 kg at their own COD equivalents = 1038 g COD per kg TS over 815 g VS; the fractionation below derives 1.275 (+0.1 %)
    cod_per_vs_tolerance: 0.10   # DESIGN  -
    ph: 4.0                      # DESIGN  pH; assumed: well-preserved grass silage 3.8-4.3 (McDonald et al. 1991); not published
    fractionation:               # DESIGN  kg COD/kg COD; RE-DERIVED on the 2024 basis (lead's freeze): raw COD shares are ch 0.578, pr 0.202, li 0.081, acids 0.139 (acetic + butyric + propionic + lactic at 1.07 / 1.82 / 1.51 / 1.07 kg COD/kg); the inert share is carved out of the carbohydrate as before
      f_ch: 0.328                #   carbohydrates (XC less the silage acids) after removing the non-degradable 0.25
      f_pr: 0.202                #   proteins, T2024 Table 1 XP (mean 147.5 g/kg TS)
      f_li: 0.081                #   lipids, T2024 Table 1 XL (mean 29 g/kg TS)
      f_xi: 0.25                 #   particulate inerts: assumed from BMP: grass-silage BMP ~0.33 m3 CH4/kg VS (Amon et al. 2007b, cited in the 2024 ESM) over the theoretical 0.446 (1.274 x 0.35) = 74 % degradable
      f_si: 0.0                  #   no soluble inerts assumed
      f_vfa: 0.139               #   silage acids as acetate-equivalent COD: T2024 Table 1 per kg TS (the 2024 ESM Table S2 note b: "S_ac included lactic acid")
    fractionation_concentration: 100.0   # DESIGN  -; assumed: ensiling quality varies between clamps (sd ~0.05 on the 0.33 share)
    tan: 0.038                   # DESIGN  kmol N/m3; 0.10 x tkn (ammonia N below 10 % of total N in well-preserved silage, McDonald et al. 1991) = 0.54 g N/kg FM
    tkn: 0.383                   # DESIGN  kmol N/m3; T2024 Table 1 total N (25.6 / 21.8 g N per kg TS, mean 23.7) x 226.5 g TS/kg FM = 5.37 g N/kg FM (/14.007); implied under inert_N_I and the fractionation: 0.430 (+12 %, inside tkn_tolerance)
    tkn_tolerance: 0.15          # DESIGN  -
    inert_N_I: 0.001   # DESIGN  kmol N/kg COD; PR #7 Plant A override (see cattle_slurry)
    s_ic: 0.0                    # DESIGN  kmol C/m3; assumed: silage at pH ~4 carries no bicarbonate
    s_cat: 0.10                  # DESIGN  kmol/m3; assumed: K+ of grass silage is 2-3 % TS (~0.2 kmol/m3 FM); half taken as balanced by organic anions already in f_vfa
    s_an: 0.05                   # DESIGN  kmol/m3; assumed
    s_ca: 0.02                   # DESIGN  kmol/m3; assumed: ~0.8 g Ca/L; not published
  # ------------------------------------------------------------------ Plant B feeds
  food_waste:
    feed_id: food_waste
    kind: food_waste
    status: provisional
    description: >-
      Source-separated food waste (pre-shredded, pulped). NOT a Muscatine stream and not
      a feed of any frozen plant (PR #7's Plant B carried it; PR #6's Plant B does not):
      moisture 70-74 %, VS/TS 83-87 % (Zhang et al. 2007); carbohydrates 36 % VS on
      average and highly variable (Fisgativa et al. 2016, 70-paper compilation);
      carbohydrates 12-74 %, proteins 14-18 %, lipids 4-34 % of VS (Bong et al. 2018);
      VS destruction ~81 % in BMP (Zhang et al. 2007), i.e. ~19 % inert.
    density: 1000.0              # DESIGN  kg/m3; assumed (pulped food waste)
    ts: 0.28                     # DESIGN  kg TS/kg wet; Zhang et al. 2007: moisture 70-74 %
    vs_of_ts: 0.85               # DESIGN  kg VS/kg TS; Zhang et al. 2007: VS/TS 83-87 %
    inert_cod_equivalent: 1.42   # DESIGN  kg COD/kg VS mass; SLUDGE VALUE BY THE LEAD'S INSTRUCTION (freeze 2026-09-02): food-waste inerts are not lignocellulosic; taken at the sludge-derived 1.42 (C5H7O2N biomass-like), an assumption, not a measurement
    cod_per_vs_literature: 1.486 # DESIGN  kg COD/kg VS; CHECK: assumed VS mass shares carbohydrate 0.68 / protein 0.17 / lipid 0.15 (Bong et al. 2018 ranges) x COD equivalents; the fractionation below derives 1.487 (+0.1 %) at this feed's inert equivalent of 1.42
    cod_per_vs_tolerance: 0.10   # DESIGN  -
    ph: 5.1                      # DESIGN  pH; Fisgativa et al. 2016 (food waste arrives acidified, pH 5.1)
    fractionation:               # DESIGN  kg COD/kg COD; raw COD shares of the VS mass shares are ch 0.545, pr 0.163, li 0.293 (unchanged from PR #7)
      f_ch: 0.36                 #   assumed: carbohydrate after removing VFA (0.04) and the non-degradable share
      f_pr: 0.16                 #   assumed: Bong et al. 2018 protein 14-18 % VS
      f_li: 0.25                 #   assumed: lipid share reduced from 0.29 to leave room for the inert share
      f_xi: 0.17                 #   assumed: ~19 % non-degradable (Zhang et al. 2007 VS destruction 81 %), split 0.17 particulate + 0.02 soluble
      f_si: 0.02                 #   assumed
      f_vfa: 0.04                #   assumed: food waste arrives acidified (pH 5.1, Fisgativa et al. 2016)
    fractionation_concentration: 40.0    # DESIGN  -; assumed: food waste is the most variable feed (Fisgativa et al. 2016); sd ~0.075 on the 0.36 share
    tan: 0.03                    # DESIGN  kmol N/m3; assumed 0.42 g N/L (partly hydrolysed proteins in stored food waste)
    tkn: 0.493                   # DESIGN  kmol N/m3; derived: protein 0.17 kg/kg VS / 6.25 x 0.238 kg VS/kg = 6.47 g N/kg + 0.42 g/kg NH4-N = 6.9 g N/kg (C/N ~15, inside the 6-19 of Xiao et al. 2021); implied under inert_N_I: 0.509 (+3 %)
    tkn_tolerance: 0.15          # DESIGN  -
    inert_N_I: 0.0015  # DESIGN  kmol N/kg COD; PR #7 Plant B override: assumed, food-waste inerts (fibre) carry far less N than sludge-derived inerts (BSM2 0.00429)
    s_ic: 0.0                    # DESIGN  kmol C/m3; assumed: acidified feed carries no bicarbonate
    s_cat: 0.152                 # DESIGN  kmol/m3; assumed: Na+/K+ of food waste. RAISED from
                                 # 0.05 by the lead's M2 ruling of 2026-09-09, applied to every
                                 # catalogue stream. At 0.05 the stream carried 0.152 kmol/m3 of
                                 # acetate ANION at its cited pH 5.1 and only 0.05 kmol/m3 of
                                 # net cations to balance it -- the assay read 3.0x the charge
                                 # the simulator would be fed, the same defect as the HSW's 503x
                                 # with the sign reversed. The CITED pH is kept (Fisgativa et al.
                                 # 2016 measured it; the cation content was only ever assumed)
                                 # and 0.152 kmol/m3 is 3.5 g Na+K per litre, mid-range for food
                                 # waste and consistent with its 14 g/L of free acetic acid.
                                 # NO PLANT FEEDS THIS STREAM (Plant A: slurry + silage; B:
                                 # sludges + HSW + FOG; C: sludges), so nothing generated moves.
    s_an: 0.03                   # DESIGN  kmol/m3; assumed
    s_ca: 0.015                  # DESIGN  kmol/m3; assumed: ~0.6 g Ca/L
  high_strength_waste:
    feed_id: high_strength_waste
    kind: hsw
    status: provisional
    description: >-
      Trucked high-strength industrial organic waste as received at Muscatine (PR #7 id
      hsw_liquid; LABS-raw HSW-COD_mgL, HSW-VS_percent). COD mean 137,575 mg/L (sd
      96,508; p50 128,000; p95 260,250; n = 632 after the provider's de-duplication),
      VS 6.16 % w/w (sd 3.49; p95 11.7; n = 745). Delivered on 992 of 1,103 days,
      0-190 m3/d (p95 106 m3/d, total for two digesters). Lipid-rich (COD/VS 2.23).
    density: 1000.0              # DESIGN  kg/m3; assumed (liquid waste)
    ts: 0.0733                   # DESIGN  kg TS/kg wet; derived: VS 6.16 % w/w (LABS-raw mean) at an assumed VS/TS of 0.84
    vs_of_ts: 0.84               # DESIGN  kg VS/kg TS; assumed (food-processing waste)
    inert_cod_equivalent: 1.42   # DESIGN  kg COD/kg VS mass; sludge-derived value (lead's freeze: the Muscatine feeds); HSW inerts are biological solids of food-processing origin, taken at the C5H7O2N 1.42
    cod_per_vs_literature: 2.234 # DESIGN  kg COD/kg VS; CHECK, MEASURED: LABS-raw means 137.6 kg COD/m3 / 61.6 kg VS/m3 (Muscatine); the fractionation below derives 2.186 (-2.2 %) at this feed's inert equivalent of 1.42
    cod_per_vs_tolerance: 0.10   # DESIGN  -
    ph: 7.0                      # DESIGN  pH; assumed. RAISED from 5.0 by the lead's M2 ruling
                                 # of 2026-09-09 (amendment to ruling 3). At the declared
                                 # composition the charge balance of this stream closes only
                                 # at pH 13.04 -- 0.205 kmol/m3 of net strong-cation charge
                                 # with 0.01 kmol C/m3 of inorganic carbon leaves nothing but
                                 # hydroxide to balance it, i.e. a caustic solution, which no
                                 # food or beverage waste is. Ruling 3's caustic is spent
                                 # neutralising the stream's own acidity, so it arrives as
                                 # sodium bicarbonate: cations PAIRED with S_IC below, at a
                                 # pH a real CIP-buffered industrial waste is delivered at.
    fractionation:               # DESIGN  kg COD/kg COD; ADJUSTED (lead's decision 2026-09-02, answer 1): PR #7's split (ch 0.20 / pr 0.10 / li 0.55 / xi 0.08 / si 0.02 / vfa 0.05) derived only 1.79 kg COD/kg VS, 20 % under the measured 2.23; the lipid COD share is raised to 0.75 (the lead's 0.7-0.75), which by the equivalents is 0.56 of the VS mass, and the carbohydrate, protein and inert shares reduced in proportion, so the derived COD/VS passes the +/- 10 % check against the measured value; composition is not measured at Muscatine
      f_ch: 0.10                 #   assumed (was 0.20)
      f_pr: 0.06                 #   assumed (was 0.10)
      f_li: 0.75                 #   assumed: lipid COD share needed for the measured COD/VS (was 0.55)
      f_xi: 0.03                 #   assumed (was 0.08)
      f_si: 0.02                 #   assumed
      f_vfa: 0.04                #   assumed (was 0.05)
    fractionation_concentration: 30.0    # DESIGN  -; assumed: the HSW COD varies by 70 % (sd/mean, LABS-raw), its composition is not measured
    tan: 0.01                    # DESIGN  kmol N/m3; assumed: not measured at Muscatine
    tkn: 0.076                   # DESIGN  kmol N/m3; derived from the fractionation with inert_N_I (not measured at Muscatine; was 0.127 with the old split)
    tkn_tolerance: 0.15          # DESIGN  -
    inert_N_I: 0.0015  # DESIGN  kmol N/kg COD; PR #7 Plant B override (see food_waste)
    s_ic: 0.1607                 # DESIGN  kmol C/m3; PAIRED to s_cat by the lead's M2 ruling
                                 # of 2026-09-09 (amendment to ruling 3). Was 0.01 (assumed).
                                 # The value is not fitted: it is the inorganic carbon that
                                 # balances this stream's cation charge at the declared pH 7.0,
                                 # i.e. the amount that makes the visible alkalinity assay and
                                 # the charge the simulator is fed describe the same stream
                                 # (10.75 kg CaCO3/m3 either way; before the ruling the assay
                                 # read 0.0214 against the same 10.75, a factor of 503).
                                 # s_cat is UNCHANGED, so what reaches the digester as strong-ion
