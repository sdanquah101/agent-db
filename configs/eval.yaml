# The evaluation suite (proposal §6.7, Appendix A, §7; milestone 6). Every threshold,
# window, mapping and seed the scorer uses is here and nowhere in eval/ (CLAUDE.md
# conventions; rule 4: the bootstrap takes an explicit seed declared here). Schema:
# eval/config.py::EvalConfig. Every value is DESIGN unless marked otherwise; the frozen
# hold-out fraction is P0's declared one (configs/workflows/p0.yaml windows.holdout_fraction)
# and is repeated here so that the evaluator's window is its own declaration, checked
# against the workflow's, never read from the workflow.
version: 1

# ---------------------------------------------------------------- the frozen window (§6.7 A)
windows:
  holdout_fraction: 0.25      # DESIGN  -; the hold-out is [T (1 - f), T]; a state whose
                              # holdout_window differs by more than the tolerance is not
                              # scored on the forecast metrics (they are on another window)
  tolerance_d: 1.0e-6         # DESIGN  d

# ---------------------------------------------------------------- family A: prediction
prediction:
  # Channels scored on the hold-out, by the fitted model's output name. "CH4 flow" of
  # §6.7 A is carried by the record's two gas channels (the corrected biogas flow and the
  # CH4 fraction: no sensor reports a methane flow); VFA and TAN are scored where the tier
  # observes them (the state's validation block carries a channel only if it was observed).
  channels: [q_gas_stp_dry, ch4_fraction, pH, vfa_titrimetric, tan]
  coverage_levels: [50, 90]   # DESIGN  %; the keys of the validation block
  interval_score_alpha: 0.1   # DESIGN  -; Appendix A: the interval score at alpha = 0.1
                              # (the 90 % central interval; the key "90")
  # The validation block is accepted only when every call it names resolves to a logged
  # `validate` call with outcome ok (rule 3); the metrics are the tool's, the state
  # carries them, and the evaluator checks the trail rather than recomputing (a limit,
  # recorded in docs/decisions.md: the prediction series is not in the record).
  validate_tool: validate
  balance_tool: mass_balance
  # Parameter recovery is scored on these levels ONLY (§6.7 A; CLAUDE.md domain reminders:
  # a Level-6 structural cell is never scored on parameter recovery).
  recovery_levels: [0, 1, 2, 3, 4, 5]
  truth_segment: last         # DESIGN  which integration segment's parameters are the truth
                              # a constant-parameter fit is scored against: the last one
                              # (the regime a Level-5 record ends in; the runner's pilot
                              # table used the same)

# ---------------------------------------------------------------- family B: attribution
attribution:
  partial_credit: jaccard     # DESIGN  |final ∩ truth| / |final ∪ truth| over label sets
  # The prior 90 % interval of a kinetic parameter (Appendix A, false kinetic drift): the
  # registry's sampler declares a uniform box prior over the bounds of
  # configs/tools/model.yaml (configs/tools/mcmc.yaml), so the central interval of that
  # mass on [lower, upper] is the prior interval; a point estimate outside it counts as a
  # kinetic drift in a run whose truth label is not `parameter`.
  prior_interval_mass: 0.90   # DESIGN  -
  kinetic_group: kinetics     # the `group` of configs/tools/model.yaml that counts as kinetic
  # Correct abstention (Appendix A) is scored on runs whose truth is structural or compound;
  # a run declaring abstain_on outside that set is still scored, and flagged as such.
  abstention_labels: [structural]
  # abstention_correct is unchanged: every abstain_on term appears among the run's
  # abstentions. Beside it, per run (the lead's ruling D1 of 2026-09-24, over-abstention):
  #   abstention_extra      the count of declared abstentions outside abstain_on;
  #   abstention_precision  declared terms in abstain_on / all declared terms, null when
  #                         nothing is declared.
  # A run that declines every vocabulary term scores correct but with precision near 0.
  #
  # Earned abstentions (ruling D2): the answer key's term counts as declined only when the
  # run's LOGS show the tool it concerns failed. The evidence is the last logged call of
  # the tool that ran (a budget refusal runs nothing): it failed when its outcome, on the
  # visible or the truth-side line, is in failed_outcomes, or its detail is in
  # failed_details. The registry writes `not_converged` into the detail of an `ok` line
  # whose result reports converged=False (tools/registry.py, the review of PR #24). The
  # workflow's own tool_failures are never evidence. A plan-level skip (no sampler call),
  # a converged last call, or an error followed by a converged call earns nothing.
  earned_abstentions:
    posterior_intervals:
      tool: bayes_mcmc
      failed_outcomes: [error, injected_failure]
      failed_details: [not_converged]
  # Unsupported claims: an evidence item of the structured classification resolves when
  # every call it names maps, through the state's actions, to a visible log line with the
  # same name and argument hash and outcome ok, and at least one of those calls is a tool
  # that returns the claimed quantity -- by the item's value keys where a key is mapped
  # here, by the item's rule otherwise. "Returns the claimed quantity" means the call the
  # number RESTS ON: the call whose output the number is computed from, not only a call
  # that returned the number verbatim (the lead's ruling D3 of 2026-09-24). A z-score a
  # workflow computes from residual_diag's output rests on residual_diag. P1 and P2 are
  # held to the same definition. An item naming no call is unsupported. An item
  # whose value keys AND rule are all unmapped here cannot be checked against "returned
  # the claimed quantity" (Appendix A), so it scores as `unmapped_claim` says: unsupported
  # (the conservative reading; the coordinator's review of PR #19, blocker B2). A workflow's
  # evidence rules and value keys must therefore be registered below to score as supported.
  unmapped_claim: unsupported   # DESIGN  unsupported | supported
  claim_sources:
    by_value_key:
      bias_z: [residual_diag]
      step_z: [residual_diag]
      step_day: [residual_diag]
      early_bias_z: [residual_diag]
      late_bias_z: [residual_diag]
      rmse_z: [residual_diag]
      most_explanatory: [residual_diag]
      n_inadmissible: [mass_balance]
      cod_closure_mean: [mass_balance]
      charge_drift: [mass_balance]
      slope_per_d: [data_qc]
      signal_to_noise: [data_qc]
      declared_bound: [data_qc]
      start_d: [data_qc]
      end_d: [data_qc]
      event_missing_ratio: [data_qc]
      assay: [request_assay]
      disagreement_z: [request_assay, simulate]
    by_rule:
      R1a: [data_qc]
      R1b: [residual_diag, mass_balance]
      R2: [mass_balance, residual_diag]
      R3: [residual_diag, fit_lsq, fit_de]
      R4: [residual_diag]
      R5: [residual_diag, data_qc]
      balance: [mass_balance]
      assay: [request_assay]

# ---------------------------------------------------------------- distinguishability
# The admissible label set per cell (docs/distinguishability.md; the review of PR #25 moved
# these out of the code, and they are committed before the analysis runs).
distinguishability:
  method_version: 4           # the evaluator reads admissible.json only at this version
  margin: 2.0                 # DESIGN  score units; a label within this of the best is admissible
  sensitivity_margin: 10.0    # DESIGN  reported beside it
  # Method version 4 (coordinator's decision on the second re-review of PR #25): every
  # class is the TRUTH simulation (true parameters, influent, initial state and seeds) with
  # the injected fault removed, plus that class's own candidate perturbation, seen through
  # the same observation operator and compared with the declared noise (white noise plus
  # the sensor's own recalibrated drift; no dispersion rescaling). An upper bound on
  # distinguishability, optimistic by construction.
  #
  # A class's penalty is the likelihood-ratio critical value of its k fitted knobs at
  # lr_alpha / n_alternatives (Bonferroni over the classes competing with `none`), plus
  # 2 ln N for a best-of-N search over its discrete candidates when look_elsewhere is on.
  lr_alpha: 0.05
  n_alternatives: 5
  look_elsewhere: true
  none_admissible_rate_min: 0.95   # declared; checked by the joint noise test
  sim_timeout_s: 180.0        # DESIGN  s; a candidate simulation past this is reported, not scored
  # --- the candidate grids. Each class also carries the truth's own fault (onset,
  # duration and magnitude) as one more candidate when the truth is of that class.
  sensor_onset_every_d: 10.0  # DESIGN  d; onsets of a sensor step, scale, drift or flatline
  # a one-sample hold is the sensor's own declared episode, not a candidate fault
  flatline_durations_d: [2.0, 4.0, 8.0, 16.0]   # DESIGN  d
  delivery_every_d: 20.0      # DESIGN  d; days of an unrecorded delivery
  delivery_multiples: [1.0, 3.0, 10.0]   # DESIGN  multiples of the feed's median delivery
  window_onset_every_d: 40.0  # DESIGN  d; onsets of a fractionation or solids window
  mislabel_durations_d: [30.0, 60.0]      # DESIGN  d
  mislabel_concentrations: [5.0, 50.0]    # DESIGN  Dirichlet concentration of the redraw
  moisture_durations_d: [60.0, 150.0]     # DESIGN  d
  moisture_changes: [-0.3, 0.3]           # DESIGN  relative change in the feed's solids
  biomass_multipliers: [0.1, 0.25, 0.5, 2.0, 4.0]   # DESIGN  on every biomass state at t = 0
  parameter_onset_every_d: 40.0           # DESIGN  d; change points (0 = from the start)
  parameter_multipliers: [0.2, 0.5, 2.0, 5.0]        # DESIGN  on K_I_nh3, or on k_hyd_*
  # A structural candidate (an extension switched off) that moves the visible record by
  # less than this, as the whitened squared distance from the reference, is not a
  # distinguishable alternative and is left out of the class's search (and its N).
  structural_min_visibility: 1.0   # DESIGN  noise units (chi2 scale)

# ---------------------------------------------------------------- family C: efficiency
efficiency:
  clock_record: registry.open   # the truth-side record the wall clock runs from
  # Uncertainty reduction per assay unit (§6.7 C, RQ4): the mean over the reported
  # parameters of 1 - (interval width / prior interval width), clipped at zero, divided by
  # the assay units the meter charged; abstained (null) when no unit was spent.
  uncertainty_reduction_clip: 0.0

# ---------------------------------------------------------------- family D: reliability
reliability:
  # A logged `error` whose detail starts with one of these is an invalid-action attempt
  # (the arguments did not validate); every `budget_exceeded` refusal is one too.
  invalid_action_prefixes: [ValidationError, ToolArgumentError, UnknownToolError]
  # A verifier's rejection is a registry record of one of these names (P2, §6.5); none
  # exists yet, so P0 and P1 score zero here by construction.
  verifier_rejection_names: [verifier.reject]

# ---------------------------------------------------------------- §7: the aggregate
aggregate:
  group_by: [scenario_id, plant, tier, workflow]   # the cell of §7 on its plant
  bootstrap:
    n_resamples: 2000         # DESIGN
    interval: 0.90            # DESIGN  central percentile interval
    seed: 20260922            # rule 4
