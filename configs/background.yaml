# The declared background (docs/decisions.md 2026-09-30, decision 1): the null band
# of a CLEAN record, per plant and tier, under the tools' own fitted model.
# GENERATED by `python -m scripts.declared_background publish` from the per-run
# record reports/background/runs.jsonl; do not edit by hand (a test regenerates
# it from the record and compares). Schema: tools/config.py::BackgroundConfig.
# Served by the registry tool `declared_background` (tools/background.py); read
# by P2's verifier and influent role; never by P0 or the frozen P1.
#
# Keyed by plant and tier ONLY (rule 1): the seeds are the benchmark's own and the
# band carries nothing per cell or per scenario. Plant A pools its two declared
# community states. Units: the z quantities are multiples of the declared
# measurement sd over the calibration window; closures are fractions of the load
# fed over a window; counts are counts; windows are days.
