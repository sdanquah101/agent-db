# The agent P2 (docs/p2_agents_design.md; the lead's option A of 2026-10-26): the same
# configuration as p2.yaml, with the `agents` block that selects the agent arm. Every other
# field, the frozen record included, is p2.yaml's (`extends`): the two arms cannot drift.
#
# OFFLINE unless the runner's explicit live flag is given, as for p2.yaml. Offline, the
# roles are driven by the scripted responder in the package (no model is reachable); live,
# each role's turns go through the privileged gateway (tools/p2_live.py) with the role's
# frozen prompt and tools, under the caps. No live run before a new approval record.
extends: p2.yaml
workflow_version: "0.4-agents"

agents:
  # the one allow-list of the design note, §3.1 (it replaces p2.yaml's `roles` for the
  # agent arm); `stored` and `emit_finding` are harness actions every role holds
  roles:
    data_quality:
      tools: [data_qc, set_sensor_status, inspect_record, residual_diag, simulate, declared_background]
      turns: 12                 # DESIGN  §3.2
    influent:
      tools: [inspect_record, mass_balance, feed_loads, simulate, declared_background]
      turns: 12                 # DESIGN  §3.2
    identifiability:
      tools: [describe_model, gsa_morris, gsa_sobol, fisher_info, profile_likelihood, residual_diag]
      turns: 8                  # DESIGN  §3.2
    calibration:
      tools: [residual_diag, simulate, fit_lsq, fit_de, fit_cmaes, bayes_mcmc, declared_background]
      turns: 14                 # DESIGN  §3.2
    design:
      tools: [voi_assay, request_assay]
      turns: 6                  # DESIGN  §3.2
    verification:
      tools: [inspect_record, residual_diag, simulate, declared_background, validate]
      turns: 14                 # DESIGN  §3.2, per round
  prompts:
    data_quality: p2_prompts/agents/data_quality.md
    influent: p2_prompts/agents/influent.md
    identifiability: p2_prompts/agents/identifiability.md
    calibration: p2_prompts/agents/calibration.md
    design: p2_prompts/agents/design.md
    verification: p2_prompts/agents/verification.md
  projection:
    max_points: 200             # DESIGN  §4 step 2: arrays in the projected log are cut here
    preview: 12                 # DESIGN  P1's array_preview
  rounds: 2                     # DESIGN  Q11: the verifier's round limit
  seeds:                        # rule 4: a role's seeded call takes base + its call index
    base: 1000                  # DESIGN  (p0.yaml's seeds are per procedural step)
  # the proposers' caps, the lead's Q8 (docs/p2_agents_design.md §9, decision 8): taken by
  # the agent arm's gateway in place of p2.yaml's caps, which the procedural freeze keeps
  # (check_p2_frozen reads p2.yaml's; an approval of this arm names the run's total caps,
  # these and the verifier's below added, and binds the split through config_digest)
  caps:
    max_requests: 200           # DESIGN  Q8
    max_total_tokens: 10000000  # DESIGN  Q8: 10 M tokens
    max_usd: 0.50               # DESIGN  Q8
    input_chars_per_token: 2.0  # DESIGN  as p2.yaml: conservative
  # the verifier's own budget (the lead's Q9; the design note §8's table, per run, two
  # rounds): a reserve ON TOP of the cell's envelope (the lead's ruling B, 2026-10-29), set
  # in the registry by the launcher (tools/sandbox.py apply_reserves) from this document,
  # drawn on by the verifier's calls and its named separating test, refused past it; the
  # proposers keep the whole envelope, exactly P1's; no reserve under the verifier-off
  # ablation
  verifier_budget:
    simulator_evals: 80         # DESIGN  §8: 40 per round
    assay_units: 1              # DESIGN  §8: a named test that is an assay
  # the verifier's own model caps (Q9; §8), enforced by the gateway per role beside the
  # proposers' caps above; the run's total is their sum
  verifier_caps:
    max_requests: 40            # DESIGN  §8: 20 per round
    max_total_tokens: 4000000   # DESIGN  §8: 2 M per round
    max_usd: 0.50               # DESIGN  §8: 0.25 per round
  # The agent arm's own frozen record (docs/p2_agents_design.md section 6; the lead's word
  # of 2026-10-30, "Yes to all three"): each role's prompt and the verifier's, the message
  # and finding schemas (messages.py), each role's tool specifications as the gateway checks
  # them, by sha256; the allow-list, the turn budgets and the round limit; the projection
  # rule and its size bound (the redaction rule's digest); P1's frozen model block
  # (decision d) and the caps. tools/p2_live.py::check_p2_agents_frozen recomputes every
  # item before EVERY run of the arm, offline included, and refuses the run on any
  # difference; frozen_record_sha256(config) names both records to an approval. A changed
  # prompt, schema, tool, list, budget or cap is a new freeze, on the lead's word.
  frozen:
    date: '2026-10-30'
    word: 'The lead''s word of 2026-10-30 ("Yes to all three", relayed by the coordinator at 11:03 UTC):
      the agent arm''s own record is cut first (design note section 6), the prompts frozen as they stand
      after PR #43 (merged at 01d78ac: the verifier''s own budget under ruling B, the second round and the
      separating test), then the Q6 cells. First frozen 2026-10-30.'
