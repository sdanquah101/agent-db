# Plant C — sewage-sludge digester, the "easy control" closest to ADM1's origin.
# DATASET-anchored to the same Muscatine WRRF daily file as Plant B
# (docs/anchor_datasets.md §3.1). Frozen by the lead's answers of 2026-09-02
# (docs/decisions.md "Plant configurations A/B/C — frozen", answer 4): C is the same
# digester as B with only its sewage-sludge streams (primary sludge + thickened WAS),
# i.e. Muscatine without the trucked co-substrates. Plants B and C SHARE GEOMETRY and
# form a CONTROLLED PAIR that differs only in the feed streams: C is the slower-loaded,
# steadier control (median HRT 38 d on the sludge streams), and every number stays
# traceable to the dataset.
id: C
name: Plant C (Muscatine-type sewage-sludge digester, sludge streams only)
domain: municipal primary sludge + thickened WAS, mesophilic CSTR, steady operation
anchoring: dataset
anchor_sources:
  - {key: muscatine_daily, reference: "Schroer & Just 2024, Laboratory, operational and SCADA datasets for the Muscatine WRRF (Iowa Research Online), daily file LABS-raw.csv", doi: "10.25820/data.006715", manifest_id: iowa-muscatine-wrrf}
  - {key: muscatine_paper, reference: "Schroer & Just 2023, plant description (PMC10928704)"}
geometry:
  V_liq_declared: 1836.0   # m3; one of two 485,000-gal digesters (muscatine_paper)
  V_gas: 162.0             # m3; ASSUMED: BSM2 headspace ratio 300/3400 = 0.0882 x V_liq (answer 5)
  units_at_plant: 2
  note: "Same physical unit as Plant B (controlled pair); only the feed catalogue differs. V_gas is assumed (BSM2 headspace ratio 300/3400), not reported."
hidden_active_volume:
  error_min: 0.05
  error_max: 0.15
  sign: random
temperature:
  setpoint_K: 308.48       # 35.33 C, digester-1 daily median (muscatine_daily)
  day_sd_K: 0.48
  p10_K: 308.21
  p90_K: 308.82
  source: "muscatine_daily: Dig1-T_degF, n = 1098, converted from degF"
hydraulics:
  feed_flow_m3_d: {median: 47.9, p10: 33.0, p90: 68.2, unit: "m3/d", source: "muscatine_daily: (V-TWAS + V-PS) / 2, percentiles of the daily sum", n: 1103}
  hrt_d: {median: 38.3, p10: 26.9, p90: 55.6, unit: d, source: "V_liq_declared / feed_flow (sludge streams only)"}
  hrt_consistency_tolerance: 0.05
  note: "Sludge-only HRT; the plant as operated (with co-substrates) is Plant B."
mixing:
  model: cstr
  note: "Ideal CSTR in the plant contract; imperfect mixing is a fault-injection truth variant (answer 6)."
horizon_days: 200   # DESIGN  d; every cell on this plant (the lead's ruling 3, 2026-09-11), as Plant B.
feeds:
  - name: primary_sludge
    kind: primary_sludge
    delivery: continuous
    volume_m3_d: {median: 30.3, p10: 18.5, p90: 42.9, unit: "m3/d", source: "muscatine_daily: V-PS_gal / 2", n: 1103}
    zero_days_fraction: 0.0
    schedule: daily
    source: muscatine_daily
  - name: thickened_was
    kind: thickened_was
    delivery: continuous
    volume_m3_d: {median: 17.4, p10: 9.7, p90: 31.8, unit: "m3/d", source: "muscatine_daily: V-TWAS_gal / 2", n: 1103}
    zero_days_fraction: 0.0
    schedule: daily
    source: muscatine_daily
truth_model:
  extensions: [sao, ionic_strength, carbonate, precipitation]
  note: "All four §6.1 extensions on."
scenario_subset:
  factorial: true
  levels: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  tiers: [A, B, C]
  excluded_scenarios: [ammonia_inhibition_shift, omitted_sao, compound_sao_inhibition_shift]
  note: "The ammonia scenarios run on Plant A (answer 3)."
open_questions: []
