# Plant A — agricultural co-digestion of cattle slurry and grass silage.
# STATISTICS-anchored (decision 2026-09-02) to the published operating envelope of the
# AFBI Hillsborough plant (Tisocco et al. 2024) with AU Foulum (Tisocco et al. 2026) as
# the thermophilic sibling; the envelope numbers are in configs/plant_a_statistics.yaml
# and docs/anchor_datasets.md §3.4. No open time series exists for this plant type.
#
# Frozen by the lead's answers of 2026-09-02 (docs/decisions.md "Plant configurations
# A/B/C — frozen"): the Tisocco volumes are kept, the HRT is set at 35–45 d (the range
# the paper's own feed volumes imply, not its stated 28 d) and the feed rate is derived
# from it; the SAO uptake rate is at the literature fast end so that SAO establishes
# here (verified by tests/test_plants.py); the ammonia scenarios (Level-5 inhibition
# shift, Level-6 omitted SAO, Level-7 compound) run on this plant only.
id: A
name: Plant A (AFBI-type slurry + grass-silage co-digestion)
domain: cattle slurry + grass silage co-digestion, mesophilic (41 C) CSTR, weekday silage feeding, high ammonia
anchoring: statistics
anchor_sources:
  - {key: tisocco_2024, reference: "Tisocco et al. 2024, Frontiers of Environmental Science & Engineering 18: application of a simplified ADM1 to full-scale co-digestion of cattle slurry and grass silage (AFBI Hillsborough)", doi: "10.1007/s11783-024-1810-9"}
  - {key: tisocco_2026, reference: "Tisocco et al. 2026, Environmental Science and Ecotechnology: AU Foulum thermophilic co-digestion plant", doi: "10.1016/j.ese.2026.100662"}
  - {key: westerholm_2019, reference: "Westerholm et al. 2019, Environ. Sci. Technol. 53: growth characteristics and thermodynamics of syntrophic acetate oxidizers (generation times 3–20 d)", doi: "10.1021/acs.est.9b00288"}
geometry:
  V_liq_declared: 650.0    # m3; the heated primary CSTR (tisocco_2024), kept as published
  V_gas: 57.4              # m3; ASSUMED: BSM2 headspace ratio 300/3400 = 0.0882 x V_liq (lead's answer 5)
  units_at_plant: 2
  note: "AFBI has a heated primary and an unheated secondary digester in series; the benchmark models the heated primary only. V_gas is assumed (BSM2 headspace ratio 300/3400), not reported."
hidden_active_volume:
  error_min: 0.05          # proposal §6.1: ±5–15 %
  error_max: 0.15
  sign: random
temperature:
  setpoint_K: 314.15       # 41 C (tisocco_2024: 41 +/- 0.2 C)
  day_sd_K: 0.2
  p10_K: 313.9
  p90_K: 314.4
  source: "tisocco_2024: primary digester 41 +/- 0.2 C; percentiles taken as +/- 1.25 sd"
hydraulics:
  hrt_d: {median: 40.0, p10: 35.0, p90: 45.0, unit: d, source: "lead's decision 2026-09-02 (answer 1): 35–45 d, inside the 32–50 d that tisocco_2024's volumes (650 m3 at 13–20 m3/d) imply; the paper's stated 28 d is recorded as inconsistent in plant_a_statistics.yaml"}
  feed_flow_m3_d: {median: 16.25, p10: 14.4, p90: 18.6, unit: "m3/d", source: "derived: V_liq_declared / hrt_d (p10 of flow at the 45-d HRT, p90 at 35 d); consistent with tisocco_2024's slurry 11–18 m3/d + silage 2 t FM/d"}
  hrt_consistency_tolerance: 0.02
  note: "Feed rate is derived from the chosen HRT (answer 2), so volume, flow and HRT are consistent by construction."
mixing:
  model: cstr
  note: "Ideal CSTR in the plant contract; imperfect mixing is a fault-injection truth variant (answer 6)."
# DECLARED community adaptation (lead's ruling 2, 2026-09-03). ADM1's default acetoclastic
# free-ammonia inhibition constant (BSM2 K_I_nh3 = 0.0018 kmol N/m3, ~25 mg NH3-N/L) is for
# a mesophilic sewage-sludge community. AFBI Hillsborough has run for years at a digestate
# TAN of 2.3-4.3 kg N/m3 (configs/plant_a_statistics.yaml, Tisocco et al. 2024 §3.2) while
# producing steadily, which a community at the default constant cannot do: at the default
# the acetoclastic methanogens wash out entirely within ~800 d and the whole acetate flux
# goes through syntrophic oxidation, leaving the Level-5/6/7 ammonia scenarios nothing to
# act on. An adapted community is the physical explanation and the one the plant's own
# stable operation evidences.
#
# The lead's ruling sets the adapted range at 0.02-0.05 kmol N/m3. The value is the BOTTOM
# of that range, and the reason is measured rather than aesthetic (gate G1, 2026-09-03):
#
#   * Acetoclasts and SAO compete for one substrate, so they cannot coexist at a steady
#     state. Whichever has the lower break-even acetate concentration excludes the other.
#     Measured: at K_I below ~0.003 SAO wins outright, above it the acetoclasts do, and
#     the stochastic feed does not change this. There is therefore NO adapted K_I in
#     0.02-0.05 at which both are present -- the plant is acetoclastic at all of them.
#   * The Level-5/6/7 rows are therefore staged as *transitions*: the run starts adapted
#     and acetoclastic, and a loss of adaptation at the onset day takes K_I below the
#     exclusion threshold, after which SAO grows in and takes over inside the horizon.
#   * `ammonia_inhibition_shift` admits multipliers of 0.1 to 10 (sim/faults/schema.py,
#     frozen). 0.02 x 0.1 = 0.002 is below the ~0.003 threshold; 0.035 x 0.1 = 0.0035 is
#     ABOVE it, so from the midpoint the largest admissible loss of adaptation does not
#     reach the shift at all. 0.02 is the only part of the ruled range from which the
#     frozen magnitude range can express a full de-adaptation.
#
# tests/test_plants.py pins the exclusion threshold and this consequence.
#
# TWO DECLARED BASELINES (lead's ruling 1, 2026-09-09). Which community this digester
# carries decides whether a Level-6 structural row means anything, so it is declared here
# and named by the scenario rather than left implicit in a burn-in length.
#
# MEASURED, at the 400-d burn-in and a 180-d horizon at seed 1000, through the full harness:
#
#   baseline     X_ac      X_sao     SAO share   acetate      TAN median   pH     CH4
#   adapted      1.129     6.9e-05   0.000       0.038 kg/m3  3.695        7.80   0.688
#   unadapted    9.9e-05   0.910     1.000       0.240 kg/m3  3.605        7.79   0.692
#
# Both are SOUND digesters; they are two different ones. In the adapted baseline syntrophic
# acetate oxidation carries no flux, which is why omitting it from the fitted model produced
# no residual and S6-01 was inert. In the unadapted baseline it carries all of it.
default_baseline: adapted
baselines:
  - name: adapted
    description: >-
      The acclimated community AFBI's stable operation at a digestate TAN of 2.3-4.3
      kg N/m3 evidences. Acetoclastic: X_ac 1.13 against X_sao 7e-5, so the syntrophic
      pathway is present but carries no flux. S5-01 and S7-02 are staged here, because a
      LOSS of adaptation is what those rows inject.
    adaptation:
      K_I_nh3: 0.02        # DESIGN  kmol N/m3; lead's ruling 2 range 0.02-0.05, bottom
      source: "lead's ruling 2 of 2026-09-03 on the evidence of Tisocco et al. 2024 (AFBI digestate TAN 2.3-4.3 kg N/m3 with stable production); ADM1/BSM2 default is 0.0018"
      note: "Plants B and C declare no adaptation and keep the ADM1 default: Muscatine's free ammonia is an order of magnitude below the pathway-shift window."
    expected_digestate_tan:
      median: 3.695        # MEASURED  kg N/m3; 180-d run, seed 1000, settled from d30
      p10: 3.588
      p90: 3.788
      unit: "kg N/m3"
      source: "measured through sim.run.harness.simulate_truth; inside Tisocco et al. 2024's published 2.3-4.3"
  - name: unadapted
    description: >-
      The same plant with an UNACCLIMATED acetoclastic community: ADM1's default
      K_I_nh3, at which the acetoclasts wash out (X_ac 9.9e-5) and syntrophic acetate
      oxidation carries the entire acetate flux (X_sao 0.91). Still a sound digester --
      pH 7.79, CH4 0.692 -- but a structurally different one, and the baseline S6-01 is
      staged on so that omitting SAO from the fitted model actually bites.
    adaptation: null       # the ADM1/BSM2 default K_I_nh3 = 0.0018 kmol N/m3
    expected_digestate_tan:
      median: 3.605        # MEASURED  kg N/m3; 180-d run, seed 1000, settled from d30
      p10: 3.505
      p90: 3.689
      unit: "kg N/m3"
      source: "measured as above. RULED 2026-09-09: the measured 3.5-3.7 is ACCEPTED and the lead's earlier 3.7-4.3 for this variant is WITHDRAWN, so ruling and plant contract now agree. The unadapted constant does not raise TAN -- it is slightly LOWER than the adapted baseline's, because the pathway change does not add nitrogen -- and reaching 3.7-4.3 would have needed the frozen Plant A feed nitrogen to move. Still inside Tisocco et al. 2024's published 2.3-4.3."
feeds:
  - name: cattle_slurry
    kind: slurry
    delivery: continuous
    volume_m3_d: {median: 14.5, p10: 11.0, p90: 18.0, unit: "m3/d", source: "tisocco_2024: 11–18 m3/d; median is the midpoint"}
    zero_days_fraction: 0.0
    schedule: daily
    source: tisocco_2024
  - name: grass_silage
    kind: silage
    delivery: batch
    mass_t_fm_d: {median: 2.0, p10: 2.0, p90: 2.0, unit: "t FM/d", source: "tisocco_2024: 2 t fresh matter per day, Monday to Friday"}
    zero_days_fraction: 0.2857   # no silage on Saturday and Sunday (2/7)
    schedule: "2 t FM/d Monday–Friday, none at weekends; the weekend omission produces the gas-rate drops the paper reports"
    source: tisocco_2024
truth_model:
  extensions: [sao, ionic_strength, carbonate, precipitation]
  note: "All four §6.1 extensions on; SAO matters here (high-ammonia domain)."
scenario_subset:
  factorial: false
  levels: [2, 3, 4, 5, 6, 7]
  tiers: [A]
  assigned_scenarios: [ammonia_inhibition_shift, omitted_sao, compound_sao_inhibition_shift]
  note: "Reduced subset, reported separately (§7): Levels 2–5 at Tier A, plus the ammonia scenarios that run only here (answer 3): the Level-5 inhibition shift, the Level-6 omitted-SAO scenario and their Level-7 compound."
open_questions:
  - "Digestate pH (plotted only in Tisocco 2024 Fig. 2) and hence free ammonia are not transcribed; the TAN envelope (2.3–4.3 kg N/m3) is, and the SAO-takeover test reads its midpoint from configs/plant_a_statistics.yaml."
